[package]
name = "personas-core"
version = "1.1.0"
description = "Dependency-free foundation shared by the Personas desktop crates"
authors = ["Personas"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"
# Never published to crates.io — the app ships as a Tauri bundle. This is a
# statement of fact, but it is also load-bearing for `cargo deny check`: the
# bans/wildcard rule treats a crate with no `publish` key as publishable, and
# refuses to apply `allow-wildcard-paths` to a publishable crate, so our own
# intra-workspace path dependencies were reported as wildcard errors.
publish = false

[lib]
name = "personas_core"
path = "src/lib.rs"

[features]
# Mirrors the desktop crate's `ml` feature so `#[cfg(feature = "ml")]` gates
# inside moved modules keep their meaning. Carries no deps of its own — it only
# needs to EXIST here so the cfg resolves; the desktop crate's `ml` feature
# forwards to it.
ml = []
# Same deal for `p2p` — `models` gates the pairing/identity structs behind it.
p2p = []
# `desktop` is NOT a cfg-only mirror: `crypto` picks the OS-keychain master-key
# path behind it, and the `#[cfg(not(feature = "desktop"))]` arm is the mobile
# stub that always reports "keychain unavailable". If this feature does not
# exist here, that gate is silently always-false and the desktop app quietly
# drops to the local fallback key. The desktop crate's own `desktop` feature
# forwards to this one.
desktop = ["dep:keyring"]

[dependencies]
regex = { workspace = true }
# AppError's #[from] conversions pull these in. Note what is NOT here: no other
# Personas crate. "Core" means no INTERNAL dependencies — external leaf crates
# are fine and are shared with the desktop crate anyway (same versions/features,
# so cargo unifies them and nothing is compiled twice).
#
# Versions and base feature sets come from [workspace.dependencies] in
# ../Cargo.toml, so they cannot drift between the four crates.
serde = { workspace = true }
serde_json = { workspace = true }
# Scope derivation walks a member repo to size its territories (harvest_scopes).
walkdir = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true, features = ["preupdate_hook"] }
r2d2 = { workspace = true }
# error_taxonomy's UsageLimit carries a reset timestamp.
chrono = { workspace = true }
ts-rs = { workspace = true }

# --- crate-split step 3: models / validation / crypto / cron / url_safety ---
tracing = { workspace = true }
r2d2_sqlite = { workspace = true }  # pool::DbPool
uuid = { workspace = true }
chrono-tz = { workspace = true }  # cron: timezone-aware schedules
url = { workspace = true }  # url_safety
hex = { workspace = true }
rand = { workspace = true }
# crypto: AES-256-GCM credential vault + RSA key exchange + HKDF derivation.
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hkdf = { workspace = true }
rsa = { workspace = true }
zeroize = { workspace = true }
# url_safety implements `reqwest::dns::Resolve` for the SSRF-safe client.
reqwest = { workspace = true }
tokio = { workspace = true }
iana-time-zone = { workspace = true }  # models::trigger, local-tz default
whoami = { workspace = true }  # crypto, machine-bound key derivation
ammonia = { workspace = true }  # validation, HTML sanitization
tempfile = { workspace = true }  # validation, atomic file writes
# trace.rs emits Sentry breadcrumbs for engine spans.
sentry = { workspace = true }

# Backend features are required in keyring 3.x — without one of `apple-native`,
# `windows-native`, or `sync-secret-service`, the crate ships its mock backend
# which silently no-ops every write and reads back nothing. The three backends are set
# once, in [workspace.dependencies].
keyring = { workspace = true, optional = true }

# crypto derives a machine-bound key from the real uid, and validation opens
# files with O_NOFOLLOW — both behind #[cfg(unix)], so this is unix-only.
# Missing since the crate split: the extraction was validated with `cargo check`
# on Windows, where those cfg blocks compile out, so `libc` was never needed
# locally and every Linux/macOS build failed with E0433.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# crypto uses DPAPI (CryptProtectData) and validation opens files with explicit
# share flags. Core needs Win32_Foundation, Win32_Security_Cryptography and
# Win32_Storage_FileSystem, which is the workspace spec as-is; the desktop and
# engine crates add three more on top.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[lints]
workspace = true
