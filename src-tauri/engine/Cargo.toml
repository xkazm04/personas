[package]
name = "personas-engine"
version = "1.1.0"
description = "Portable half of the Personas execution engine"
authors = ["Personas"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"
# Never published to crates.io — the app ships as a Tauri bundle. This is a
# statement of fact, but it is also load-bearing for `cargo deny check`: the
# bans/wildcard rule treats a crate with no `publish` key as publishable, and
# refuses to apply `allow-wildcard-paths` to a publishable crate, so our own
# intra-workspace path dependencies were reported as wildcard errors.
publish = false

[lib]
name = "personas_engine"
path = "src/lib.rs"

[features]
# Every feature the moved code mentions in a `#[cfg(feature = "...")]` MUST be
# declared here. A cfg naming a feature the crate does not declare is silently
# always-false — that trap has bitten this refactor repeatedly (core's `desktop`
# gate on the OS-keychain path, db's `scraper` gate on the example seed).
desktop = [
    "personas-core/desktop",
    "personas-db/desktop",
    "dep:arboard",
    "dep:notify",
    "dep:keyring",
    "dep:xcap",
    "dep:image",
]
ml = ["personas-core/ml", "personas-db/ml", "dep:pdf-extract"]
p2p = [
    "personas-core/p2p",
    "personas-db/p2p",
    "dep:ed25519-dalek",
    "dep:bs58",
    "dep:mdns-sd",
    "dep:quinn",
    "dep:rcgen",
    "dep:rmp-serde",
    "dep:socket2",
]
scraper = ["personas-db/scraper", "dep:pumper-core"]
ollama = []

[dependencies]
personas-core = { workspace = true }
personas-db = { workspace = true }

# Versions and base feature sets come from [workspace.dependencies] in
# ../Cargo.toml, so they cannot drift between the four crates.
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
ts-rs = { workspace = true }
dirs = { workspace = true }
aes-gcm = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
hkdf = { workspace = true }
hex = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
tempfile = { workspace = true }
zip = { workspace = true }
rustls = { workspace = true }
# NOT optional, unlike in the desktop crate. `desktop_security` uses `which`
# without a cfg gate, so the crate does not build at default features if this is
# behind `desktop` — and CI's binding-export job builds the workspace at default
# features. In app_lib this was invisible because nothing ever built it without
# `desktop` (the Tauri permission build script fails first).
which = { workspace = true }
tauri = { workspace = true }

# desktop-gated
arboard = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }

xcap = { workspace = true, optional = true }
image = { workspace = true, optional = true }

# ml-gated
pdf-extract = { workspace = true, optional = true }

# p2p-gated
ed25519-dalek = { workspace = true, optional = true }
bs58 = { workspace = true, optional = true }
mdns-sd = { workspace = true, optional = true }
quinn = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
socket2 = { workspace = true, optional = true }

# scraper-gated
pumper-core = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
# Turns on `personas_db::init_test_db` for this crate's tests. `cfg(test)` does
# not cross a crate boundary, so the fixture builder has to be feature-gated;
# dev-only, so it never reaches a release build.
personas-db = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
