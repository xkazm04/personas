[package]
name = "personas-engine"
version = "1.1.0"
description = "Portable half of the Personas execution engine"
authors = ["Personas"]
license = "MIT"
edition = "2021"
rust-version = "1.80.0"

[lib]
name = "personas_engine"
path = "src/lib.rs"

[features]
# Every feature the moved code mentions in a `#[cfg(feature = "...")]` MUST be
# declared here. A cfg naming a feature the crate does not declare is silently
# always-false — that trap has bitten this refactor repeatedly (core's `desktop`
# gate on the OS-keychain path, db's `scraper` gate on the example seed).
desktop = [
    "personas-core/desktop",
    "personas-db/desktop",
    "dep:arboard",
    "dep:notify",
    "dep:keyring",
    "dep:xcap",
    "dep:image",
]
ml = ["personas-core/ml", "personas-db/ml", "dep:pdf-extract"]
p2p = [
    "personas-core/p2p",
    "personas-db/p2p",
    "dep:ed25519-dalek",
    "dep:bs58",
    "dep:mdns-sd",
    "dep:quinn",
    "dep:rcgen",
    "dep:rmp-serde",
    "dep:socket2",
]
scraper = ["personas-db/scraper", "dep:pumper-core"]
ollama = []

[dependencies]
personas-core = { path = "../core" }
personas-db = { path = "../db" }

# Specs are copied verbatim from the desktop crate. Keep them identical: if they
# drift, cargo stops unifying the dependency and compiles it twice, which costs
# exactly the build time this crate split exists to reclaim.
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = [
    "rt-multi-thread", "macros", "sync", "time",
    "process", "io-util", "fs", "net", "signal",
] }
tokio-util = "0.7"
tracing = "0.1"
rusqlite = { version = "0.38", features = ["bundled", "hooks"] }
r2d2 = "0.8"
r2d2_sqlite = "0.32"
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
ts-rs = { version = "10", features = ["serde-compat", "chrono-impl", "serde-json-impl", "no-serde-warnings"] }
dirs = "6"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "multipart"], default-features = false }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
hkdf = "0.12"
hex = "0.4"
url = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
regex = "1"
glob = "0.3"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
rustls = { version = "0.23", features = ["ring"] }
# NOT optional, unlike in the desktop crate. `desktop_security` uses `which`
# without a cfg gate, so the crate does not build at default features if this is
# behind `desktop` — and CI's binding-export job builds the workspace at default
# features. In app_lib this was invisible because nothing ever built it without
# `desktop` (the Tauri permission build script fails first).
which = "8.0.1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }

# desktop-gated
arboard = { version = "3", optional = true }
notify = { version = "7", default-features = false, features = ["macos_kqueue"], optional = true }
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }

xcap = { version = "0.7", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"], optional = true }

# ml-gated
pdf-extract = { version = "0.12", optional = true }

# p2p-gated
ed25519-dalek = { version = "2", features = ["serde", "zeroize", "rand_core"], optional = true }
bs58 = { version = "0.5", optional = true }
mdns-sd = { version = "0.11", optional = true }
quinn = { version = "0.11", optional = true }
rcgen = { version = "0.13", optional = true }
rmp-serde = { version = "1.3", optional = true }
socket2 = { version = "0.5", optional = true }

# scraper-gated
pumper-core = { git = "https://github.com/xkazm04/pumper.git", rev = "7e13f31", default-features = false, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Turns on `personas_db::init_test_db` for this crate's tests. `cfg(test)` does
# not cross a crate boundary, so the fixture builder has to be feature-gated;
# dev-only, so it never reaches a release build.
personas-db = { path = "../db", features = ["test-support"] }
