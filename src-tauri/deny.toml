# cargo-deny configuration — supply-chain policy enforcement
# Run: cd src-tauri && cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

# --------------------------------------------------------------------------
# Advisory database — block known vulnerabilities
# --------------------------------------------------------------------------
[advisories]
# cargo-deny 0.17 removed the per-severity keys this section used to carry.
# `vulnerability = "deny"` is gone because every security advisory is now an
# error unconditionally — you opt out per-advisory via `ignore`, not by
# lowering a severity. `unmaintained` survived the rename but changed KIND:
# it is no longer a severity ("warn") but a SCOPE, one of
# all | workspace | transitive | none.
#
# This mattered more than a config nit. With the old keys in place cargo-deny
# refused to deserialize this file at all and exited before running a single
# check — so `cargo deny check` in ci.yml and audit.yml was reporting a config
# error, not a supply-chain verdict. A gate that cannot parse its own policy
# is indistinguishable from a gate that passes, which is the failure shape
# this repository keeps finding.
#
# Scope is `workspace`: unmaintained crates we depend on directly are
# actionable, transitive ones usually are not and would turn a security gate
# into noise nobody reads.
unmaintained = "workspace"
yanked = "warn"
ignore = []

# --------------------------------------------------------------------------
# License policy — allowlist of acceptable OSS licenses
# --------------------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    # MIT-0 is MIT with the attribution clause removed — strictly more
    # permissive than the MIT already allowed above. Carried by
    # `borrow-or-share`, a transitive dep of the URI parsing stack.
    "MIT-0",
    # CDLA-Permissive-2.0 is the Linux Foundation's permissive data licence,
    # no copyleft and no attribution obligation on redistribution. It reaches
    # us only through `webpki-roots` (0.26 and 1.0 both in the graph), which
    # ships Mozilla's CA set — the licence is on the DATA, which is the whole
    # reason a data licence appears in a Rust dependency graph at all.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# --------------------------------------------------------------------------
# Bans — prevent problematic crates or excessive duplication
# --------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
# Every "wildcard dependency" cargo-deny found here was one of our own
# workspace crates — `personas-core = { path = "../core" }` and its eight
# siblings — because a path dependency carries no version requirement and the
# wildcard check cannot tell that apart from `version = "*"` off crates.io.
# An intra-workspace path dep is not a supply-chain surface: it resolves to a
# directory in this repository, not to whatever the registry serves next.
# There are no real wildcards; there were nine false ones.
allow-wildcard-paths = true
deny = []
skip = []

# --------------------------------------------------------------------------
# Sources — only allow crates.io, block unknown registries/git
# --------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
# pumper-core is the embedded scraper engine, pinned to an exact rev of a
# repository this project owns. It is optional and only enters the graph under
# the `scraper` feature, but it is present in Cargo.lock unconditionally — so
# with an empty allow-git this policy denies the lockfile as it stands today.
allow-git = ["https://github.com/xkazm04/pumper.git"]
