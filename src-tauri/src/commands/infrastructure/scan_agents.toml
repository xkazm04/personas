[[agents]]
key = "monetization-advisor"
label = "Monetization Advisor"
emoji = "💰"
abbreviation = "MON"
color = "#F59E0B"
category_group = "business"
description = "Suggests revenue optimization and pricing strategies"
examples = "Premium features, Usage limits, Conversion funnels"
