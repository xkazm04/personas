[[agents]]
key = "tech-debt-tracker"
label = "Tech Debt Tracker"
emoji = "🏦"
abbreviation = "TDT"
color = "#EF4444"
category_group = "mastermind"
description = "Catalogs technical debt and prioritizes repayment"
examples = "Legacy code, Missing abstractions, Workarounds"
