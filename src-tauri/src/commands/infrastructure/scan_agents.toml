[[agents]]
key = "code-optimizer"
label = "Code Optimizer"
emoji = "⚡"
abbreviation = "OPT"
color = "#3B82F6"
category_group = "technical"
description = "Identifies performance bottlenecks and optimization opportunities"
examples = "Reduce bundle size, Optimize database queries, Improve render performance"
match = "performance|render|bundle|query|slow|cache|optim"

[[agents]]
key = "security-auditor"
label = "Security Auditor"
emoji = "🔒"
abbreviation = "SEC"
color = "#EF4444"
category_group = "technical"
description = "Identifies security vulnerabilities and best practice violations"
examples = "XSS prevention, SQL injection risks, Authentication gaps"
match = "auth|login|token|secret|password|credential|session|encrypt|permission"

[[agents]]
key = "architecture-analyst"
label = "Architecture Analyst"
emoji = "🏗️"
abbreviation = "ARC"
color = "#8B5CF6"
category_group = "technical"
description = "Evaluates system architecture and suggests structural improvements"
examples = "Reduce coupling, Improve modularity, Better separation of concerns"
match = "architect|module|component|layer|service|pattern|coupling|abstract"

[[agents]]
key = "test-strategist"
label = "Test Strategist"
emoji = "🧪"
abbreviation = "TST"
color = "#10B981"
category_group = "technical"
description = "Identifies gaps in test coverage and suggests testing strategies"
examples = "Missing edge cases, Integration test gaps, E2E scenarios"
match = "test|spec|coverage|mock|assert|e2e|integration|unit"

[[agents]]
key = "dependency-auditor"
label = "Dependency Auditor"
emoji = "📦"
abbreviation = "DEP"
color = "#F59E0B"
category_group = "technical"
description = "Analyzes dependencies for updates, vulnerabilities, and bloat"
examples = "Outdated packages, Unused dependencies, Version conflicts"
match = "package|dependency|import|library|version|npm|cargo"

[[agents]]
key = "ux-reviewer"
label = "UX Reviewer"
emoji = "🎨"
abbreviation = "UXR"
color = "#EC4899"
category_group = "user"
description = "Reviews user experience patterns and suggests improvements"
examples = "Loading states, Error handling UX, Navigation clarity"
match = "ui|ux|component|page|view|form|modal|button|layout|style"

[[agents]]
key = "accessibility-checker"
label = "Accessibility Checker"
emoji = "♿"
abbreviation = "A11Y"
color = "#6366F1"
category_group = "user"
description = "Identifies accessibility issues and WCAG compliance gaps"
examples = "Missing ARIA labels, Color contrast, Keyboard navigation"
match = "a11y|accessibility|aria|wcag|screen.?reader|keyboard|contrast"

[[agents]]
key = "mobile-specialist"
label = "Mobile Specialist"
emoji = "📱"
abbreviation = "MOB"
color = "#14B8A6"
category_group = "user"
description = "Evaluates mobile experience and responsive design"
examples = "Touch targets, Viewport handling, Mobile performance"
match = "mobile|responsive|viewport|touch|swipe|tablet"

[[agents]]
key = "error-handler"
label = "Error Handler"
emoji = "🚨"
abbreviation = "ERR"
color = "#F97316"
category_group = "user"
description = "Reviews error handling, recovery flows, and user messaging"
examples = "Graceful degradation, Retry logic, Error boundaries"
match = "error|exception|catch|boundary|fallback|retry|toast|alert"

[[agents]]
key = "onboarding-designer"
label = "Onboarding Designer"
emoji = "🎯"
abbreviation = "ONB"
color = "#06B6D4"
category_group = "user"
description = "Evaluates first-time user experience and onboarding flows"
examples = "Setup wizards, Progressive disclosure, Empty states"
match = "onboard|wizard|setup|welcome|tutorial|getting.?started"

[[agents]]
key = "feature-scout"
label = "Feature Scout"
emoji = "🔭"
abbreviation = "SCT"
color = "#8B5CF6"
category_group = "business"
description = "Identifies missing features and enhancement opportunities"
examples = "Competitive features, User-requested features, Market gaps"
