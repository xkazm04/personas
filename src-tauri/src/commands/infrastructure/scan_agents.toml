[[agents]]
key = "innovation-catalyst"
label = "Innovation Catalyst"
emoji = "💡"
abbreviation = "INN"
color = "#F59E0B"
category_group = "mastermind"
description = "Suggests innovative approaches and paradigm shifts"
examples = "AI integration, New architectures, Emerging patterns"
match = "ai|ml|machine.?learn|llm|agent|automat|innovat"

[[agents]]
key = "risk-assessor"
label = "Risk Assessor"
emoji = "⚠️"
abbreviation = "RSK"
color = "#F97316"
category_group = "mastermind"
description = "Identifies project risks and mitigation strategies"
examples = "Single points of failure, Scaling risks, Data loss scenarios"
