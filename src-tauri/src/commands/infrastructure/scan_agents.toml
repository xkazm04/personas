[[agents]]
key = "integration-planner"
label = "Integration Planner"
emoji = "🔗"
abbreviation = "INT"
color = "#6366F1"
category_group = "mastermind"
description = "Plans system integrations and API design"
examples = "Third-party APIs, Webhook design, Data synchronization"
