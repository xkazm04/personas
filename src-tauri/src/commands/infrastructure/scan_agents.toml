[[agents]]
key = "analytics-planner"
label = "Analytics Planner"
emoji = "📊"
abbreviation = "ANA"
color = "#3B82F6"
category_group = "business"
description = "Plans analytics instrumentation and data collection"
examples = "Event tracking, Funnel analysis, User behavior insights"
