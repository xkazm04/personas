[[agents]]
key = "documentation-auditor"
label = "Documentation Auditor"
emoji = "📝"
abbreviation = "DOC"
color = "#10B981"
category_group = "business"
description = "Reviews documentation completeness and quality"
examples = "API docs, README quality, Code comments"
