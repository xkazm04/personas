[[agents]]
key = "growth-hacker"
label = "Growth Hacker"
emoji = "🚀"
abbreviation = "GRW"
color = "#EC4899"
category_group = "business"
description = "Identifies growth opportunities and viral mechanics"
examples = "Sharing features, Referral programs, Network effects"
