[[agents]]
key = "devops-optimizer"
label = "DevOps Optimizer"
emoji = "🔧"
abbreviation = "OPS"
color = "#14B8A6"
category_group = "mastermind"
description = "Optimizes build, deploy, and operations workflows"
examples = "CI/CD pipelines, Docker optimization, Monitoring gaps"
match = "ci|cd|deploy|docker|pipeline|build|monitor|infra"

[[agents]]
key = "bounty-hunter"
label = "Bounty Hunter"
emoji = "🏴‍☠️"
abbreviation = "BNT"
color = "#DC2626"
category_group = "technical"
description = "Scans for exploitable bugs, logic flaws, and edge cases that qualify for bug bounty programs — pricing anomalies, data inconsistencies, rule violations, race conditions, and UI/logic mismatches"
examples = "Pricing calculation errors, Race conditions in state updates, Inconsistent validation rules, Edge cases in boundary logic, Data leaks between user contexts"
match = "exploit|vulnerab|race.?condition|edge.?case|logic.?flaw|inconsisten|data.?leak|bounty"

[[agents]]
key = "business-strategist"
label = "Business Strategist"
emoji = "💼"
abbreviation = "BIZ"
color = "#F59E0B"
category_group = "business"
description = "Finds pure business-value opportunities: monetization, conversion, user retention, missing features competitors have, pricing/packaging surfaces, and workflow friction that costs users money or time. Thinks like a product manager, not an engineer — proposes WHAT to build for value, not refactors."
examples = "Add usage-based billing tier, Reduce onboarding drop-off step, Export reports customers ask for, Surface ROI metrics on dashboard"
match = "business.?value|monetiz|conversion|retention|competitor|workflow.?friction|revenue|value.?prop"
