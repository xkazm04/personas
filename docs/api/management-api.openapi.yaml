openapi: 3.1.0
info:
  title: Personas Management API
  version: "1.0.0"
  description: |
    Local HTTP API exposed by the Personas desktop app on `127.0.0.1:9420` for
    external integrations (MCP servers, CLI scripts, A2A clients, and — after a
    user-approved pairing — cloud web apps).

    ## Authentication
    Every `/api/*`, `/a2a/*`, and `/agent-card/*` request needs
    `Authorization: Bearer <pk_...>`. Keys are minted in the desktop app
    (Settings → API Keys) or via the pairing ceremony (see `/pair/*`). The
    `/pair/*` endpoints and `/health` are unauthenticated.

    ## Scopes (least-privilege)
    Keys carry a JSON array of scopes; routes are authorized against them:
    - `personas:read` — list/read personas + executions (implicit for GET).
    - `personas:execute` — execute any persona (mutating `/api/*`).
    - `personas:execute:persona:<id>` — execute only persona `<id>`.
    - `personas:build` — the `/api/build*` flow.
    - `proxy` / `proxy:credential:<id>` — the credential proxy (NOT covered by
      `personas:execute`).
    - `personas:test` — the headless bridge test surface (`/api/kp/test/*`).
      Minted only by the mode's own auto-pairing; the routes it gates exist
      only while `PERSONAS_HEADLESS_BRIDGE=1`.

    A route naming a persona/credential is satisfied by the broad scope OR the
    matching per-resource grant. Keys may be origin-bound (paired) and expiring;
    per-key rate limit 120 req/60 s (→ 429 + `Retry-After`).

    See docs/architecture/cloud-integration-bridge.md for the full design.
servers:
  - url: http://127.0.0.1:9420
    description: Loopback management server (plain HTTP; a secure context for browsers)

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Liveness probe (and which route table :9420 bound)
      description: |
        `management` reports whether this boot bound the full route table. The
        port serves one of two: the full table (webhook + management API,
        including `/api/kp/*`, plus `/pair/*`) or, if `AppState` never resolves
        at scheduler start, a webhook-only fallback of three routes. Probe here
        rather than inferring a missing route from a 404.
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: personas-webhook }
                  management:
                    type: boolean
                    description: true when /api/* and /pair/* are served on this boot
                  headlessBridge:
                    type: boolean
                    description: |
                      true when this process started with `PERSONAS_HEADLESS_BRIDGE=1`
                      (docs/architecture/cloud-integration-bridge.md §13): pairing
                      requests auto-approve, kp hire requests auto-execute, and App
                      master probation reviews auto-decide, all recorded as actor
                      `headless_bridge`. An unattended driver VERIFIES the mode here
                      rather than inferring it from a pairing that happened to succeed.

  /api/personas:
    get:
      summary: List personas
      description: Any valid key (no scope required).
      responses:
        "200":
          description: Persona summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/personas/{personaId}:
    get:
      summary: Get a persona
      parameters: [{ $ref: "#/components/parameters/PersonaId" }]
      responses:
        "200":
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/execute/{personaId}:
    post:
      summary: Execute a persona (non-blocking)
      description: |
        Requires `personas:execute` OR `personas:execute:persona:{personaId}`.
        Returns immediately with an `executionId`; poll `/api/executions/{id}`.
      parameters: [{ $ref: "#/components/parameters/PersonaId" }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteInput" }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /api/executions:
    get:
      summary: List executions
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string } }
        - { name: persona_id, in: query, schema: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/executions/{executionId}:
    get:
      summary: Get one execution (poll for terminal status + output)
      parameters:
        - { name: executionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: |
            Execution record. `status` is one of `queued|running|completed|failed|incomplete|cancelled`;
            read `output` / `log_file_path` once terminal.
          content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/build:
    post:
      summary: Start an LLM-driven persona build session
      description: Requires `personas:build`. Poll `/api/build/{sessionId}`; answer/test/promote as needed.
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/BuildStart" } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/build/{sessionId}:
    get:
      summary: Build session status
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/build/{sessionId}/promote:
    post:
      summary: Promote a build draft to a live persona
      parameters: [{ $ref: "#/components/parameters/SessionId" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/kp/persona-requests:
    post:
      summary: Queue a KP hire request for human approval
      description: |
        The KP bridge intake (`src-tauri/src/engine/management_api.rs`). Requires
        `personas:build` — approving the request creates a draft persona + build
        session, the same trust tier as `/api/build`. The call does NOT build
        anything: it inserts a `kp_hire_request` row into the companion approval
        inbox and returns immediately with `status: "pending_approval"`. A human
        approves or rejects it in the desktop app; either way KP is notified at
        `kp.baseUrl` with `reportToken` and can also poll the status route below.

        **Headless bridge (§13).** With `PERSONAS_HEADLESS_BRIDGE=1` the request
        is executed on the spot, through the same executor a human click reaches,
        and the response reports the real outcome instead of `pending_approval`:
        `{requestId, status: "approved" | "failed", autoApproved: true,
        actor: "headless_bridge", message}`. The approval row records
        `decidedBy: "headless_bridge"` in its payload. The status route below
        still answers, so a client that polls anyway sees the same fate.

        **App master (P4).** The body gains an optional `appMaster` block
        (kp's `AppMasterSpec`). Present ⇒ approving the request ALSO ensures a
        Dev project for `appMaster.app.repo`, creates/binds a team, seeds each
        objective as a project KPI, installs the supported cadence triggers,
        sets the project's autopilot to `suggest` (probation) and persists the
        mandate + tenure. Absent ⇒ the request takes exactly the pre-P4 path.
        See `docs/architecture/cloud-integration-bridge.md` §11.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/KpPersonaRequest" } } }
      responses:
        "200":
          description: Request queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string, examples: ["appr_a1b2c3d4e5f6"] }
                  status: { type: string, const: pending_approval }
        "400": { description: "Validation failure: empty/oversized field, non-http(s) kp.baseUrl, more than 32 connectors or metrics, or an appMaster block whose mandate.scopeRung is outside 0..2, whose mandate.forbiddenClasses leaves the closed vocabulary, whose app.repo carries neither a url nor a rootPath, or whose objective/trigger/tenure values leave their vocabularies or bounds" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/kp/persona-requests/{requestId}:
    get:
      summary: Poll a KP hire request's fate
      description: |
        Any valid key (generic GET rule). Answers 404 for an approval row that is
        not a `kp_hire_request`, so this route cannot enumerate the inbox.
        `status` is derived: a still-pending row older than the 24 h consent
        window reports `expired`; `approved_failed` (human approved, executor
        failed) reports `failed` so KP never tells a recruiter the request was
        turned down.
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Request state
          content:
            application/json:
              schema:
                type: object
                properties:
                  requestId: { type: string }
                  status: { type: string, enum: [pending, approved, rejected, failed, expired] }
                  personaId: { type: [string, "null"] }
                  personaName: { type: [string, "null"] }
                  buildPhase: { type: [string, "null"], description: Phase of the persona build session, when one exists }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/kp/test/tick:
    post:
      summary: "Headless bridge only: run one compressed night on demand"
      description: |
        **Exists only while `PERSONAS_HEADLESS_BRIDGE=1`** — with the mode off the
        route is not registered and answers **404**, not 403. Requires the
        `personas:test` scope (see §13); `personas:build` is not enough.

        Runs the four loop phases **synchronously and in dependency order**,
        whatever order they were asked for, reusing the existing tick bodies
        rather than reimplementing them:

        | phase | what runs | `counts` |
        | --- | --- | --- |
        | `overnight` | `run_overnight_now_core` per eligible project — autopilot capability gate, App master mandate, budget governor, fleet slot cap and branch-only dispatch all intact | `{projects, dispatched, blocked, degraded}`; `details[]` = the `NightRun` ledger rows; plus `proposals[]` and `declines[]` (below) |
        | `reconcile` | `app_master_reconcile::reconcile_tick_summary` | `{projects, branchesSeen, newlyRecorded, gated, errors}` |
        | `report` | `kp_reporter::kp_rollup_tick_summary` | `{candidates, pushed, skipped, period, errors}` |
        | `probation` | `probation_tick_summary` (raise) then the headless decision sweep | `{mandates, due, raised, deferred, decided, notes}`; `details[]` = one decision each |

        A phase that ran and found nothing to do is `ran: true` with zero counts.
        An **unknown** phase name is a 400, never a silent skip — a driver that
        typed `reconciile` and got a 200 would read the typo as a passing run.

        **The `overnight` phase also reports the night's product** — `proposals[]`
        and `declines[]`, added beside the existing fields, never in place of one
        (§13.12). Both keys are present on every overnight summary, `[]` included,
        and absent on every other phase: "the night produced nothing" is a finding,
        and a missing key is not the same answer. Proposals are the ideas standing
        `accepted` then `pending` (the ones a `suggest` night leaves for the
        morning — the very ideas a `blockedReason` counts without naming);
        declines are the ideas standing `rejected`. 50 of each, newest first.

        Two fields are admitted projections. `size` folds `dev_ideas.effort` along
        the emitter's own 1..=10 ladder (1-2 `xs` … 9-10 `xl`), `null` when absent
        or out of range. `reason` is a **lossy** map over free text — the lane has
        no decline vocabulary, only whatever the rejecting hand typed — so it
        answers `null` rather than guessing. `confidence` is always `null`:
        nothing in the backlog records one, and unmeasured is not zero.

        **`ideate` + `autopilot` make it an ideation night** (§13.13) — a night
        that proposes and dispatches nothing.

        `ideate: true` runs the idea scanner for `projectId` **before** the
        night triages, through the same entry and the same LRU lens rotation the
        `idea_replenish` subscription uses, and waits for it — so what the night
        authors is in the backlog it then reports. It bypasses that loop's
        pacing rules (the 20h per-project scan cooldown, the idle-project picker,
        the default-OFF switch), which exist to stop an unattended timer spending
        on its own initiative; it does **not** bypass the quota cooldown, because
        a spend guard is not a test artefact. Ideation never fails the tick: the
        `overnight` phase carries an `ideation` reading saying whether it ran,
        was blocked, or could not be measured.

        `autopilot` runs that one night at the mode it names instead of the
        project's stored one — read, never written, so the project is unchanged
        after the tick. `suggest` grants `ScanAndTriage` and refuses
        `DispatchFixes`, which is what makes an ideation night report
        `dispatched: 0` and leave its accepted ideas in `proposals[]`. An unknown
        mode is a **400**, never a silent fallback: a driver that typed `sugest`
        and got a 200 would read a full dispatching night as the quiet one it
        asked for.

        Every `proposals[]` and `declines[]` row also carries `createdAt` and
        `origin`, verbatim from `dev_ideas`. The two lists select by STATE and
        deliberately carry no time window, so a project holding a deck raised
        before a tenure began reports that deck; the row's own stamp is what lets
        a reader tell those apart, and `origin` whether a sensor raised it rather
        than the holder.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                  description: Scope the overnight + reconcile phases to one project. Absent ⇒ every eligible / mandated project.
                personaId:
                  type: string
                  description: Scope the report phase to one persona. Absent ⇒ every kp-linked persona.
                phases:
                  type: array
                  items: { type: string, enum: [overnight, reconcile, report, probation] }
                  description: Absent ⇒ all four.
                ideate:
                  type: boolean
                  default: false
                  description: >-
                    Author before triaging (§13.13). Requires `projectId` — an unscoped tick would spend one
                    scan agent per eligible project, and reports that as `ideation.blocked` rather than refusing.
                    Ignored by every phase but `overnight`.
                autopilot:
                  type: string
                  enum: [off, measure, suggest, full]
                  description: >-
                    Run this ONE night at this autopilot mode instead of the project's stored one. The stored
                    mode is read and never written. Absent ⇒ the stored mode. An unknown word is a 400.
      responses:
        "200":
          description: Every requested phase ran (a phase's own failures are in its `errors`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  headlessBridge: { type: boolean, const: true }
                  actor: { type: string, const: headless_bridge }
                  startedAt: { type: string, format: date-time }
                  finishedAt: { type: string, format: date-time }
                  durationMs: { type: integer }
                  projectId: { type: [string, "null"] }
                  personaId: { type: [string, "null"] }
                  phases:
                    type: array
                    items:
                      type: object
                      properties:
                        phase: { type: string, enum: [overnight, reconcile, report, probation] }
                        ran: { type: boolean }
                        skipped: { type: [string, "null"] }
                        durationMs: { type: integer }
                        counts: { type: [object, "null"] }
                        details: { type: array, items: { type: object } }
                        proposals:
                          type: array
                          description: "`overnight` only — always present there, `[]` included; absent on every other phase."
                          items:
                            type: object
                            properties:
                              title: { type: string }
                              target: { type: string, description: "The context's name, else the project's, else its id. Never blank." }
                              why: { type: [string, "null"], description: "`reasoning`, falling back to `description`." }
                              journey: { type: [string, "null"], description: "The journey the holder itself named in the idea's `Journey:` marker line, else the use case named by `use_case_id`. An honest `Journey: none` reports null." }
                              axis: { type: [string, "null"], description: "The value axis the holder itself named in the idea's `Axis:` marker line — one of `time`, `risk`, `gate`; a word outside that set reports null and never falls back. When no axis was stated: `scan_type`, falling back to `category` (a lens, not a value axis)." }
                              size: { type: [string, "null"], enum: [xs, s, m, l, xl, null], description: Folded from `effort` along the emitter's 1..=10 ladder. }
                              confidence: { type: "null", description: "Always null — the backlog records no confidence, and unmeasured is not zero." }
                              createdAt: { type: string, description: "`dev_ideas.created_at`, VERBATIM. Scanner-raised ideas carry RFC3339 UTC; a few older doors write SQLite `datetime('now')` (`YYYY-MM-DD HH:MM:SS`, UTC, no zone). Not normalised — a reader must accept both." }
                              origin: { type: [string, "null"], description: "`dev_ideas.origin`, verbatim: which sensor raised the idea, or null for a classic Idea-Scanner idea. Null is an answer, not a gap." }
                        declines:
                          type: array
                          description: "`overnight` only, same presence rule as `proposals`."
                          items:
                            type: object
                            properties:
                              title: { type: string }
                              reason:
                                type: [string, "null"]
                                enum: [low-value, outside-mandate, already-done, needs-human, null]
                                description: Projected from the free-text `rejection_reason`; null when it maps onto nothing, never guessed.
                              createdAt: { type: string, description: Same rule as a proposal's. }
                              origin: { type: [string, "null"], description: Same rule as a proposal's. }
                        ideation:
                          type: object
                          description: >-
                            `overnight` only, and only when the tick sent `ideate: true` — absent otherwise, because a
                            night that never attempted to author must not report a zero for it (§13.13).
                          properties:
                            ran:
                              type: boolean
                              description: >-
                                True only when the scan COMPLETED inside this tick, so what it authored is in the backlog
                                this same phase reports. A scan that errored or outran the wait is false with `blocked`.
                            lens: { type: [string, "null"], description: "The lenses the scan ran, comma-joined (the lane's own spelling); null when no scan was launched." }
                            authored: { type: [integer, "null"], description: "The completed scan row's own idea_count. Null is UNMEASURED, never zero — an errored scan may have written rows before it stopped." }
                            blocked: { type: [string, "null"], description: "Why there are no authored ideas this tick can vouch for; null when the scan completed. Ideation never fails the tick." }
                        errors: { type: array, items: { type: string } }
        "400": { description: One or more unknown phase names, or an unknown `autopilot` mode }
        "403": { description: "The key lacks the personas:test scope" }
        "404": { description: The headless bridge test mode is off on this process }

  /api/kp/test/seed-work:
    post:
      summary: "Headless bridge only: seed dispatchable backlog work onto a project"
      description: |
        **Exists only while `PERSONAS_HEADLESS_BRIDGE=1`** — with the mode off the
        route is not registered and answers **404**, not 403. Requires the
        `personas:test` scope, exactly like `/api/kp/test/tick`.

        The executable form of the App-master bench protocol's §4 ("create one
        backlog idea per seed … and accept them"). See §13.9 of
        `docs/architecture/cloud-integration-bridge.md` for the full reasoning.

        **It creates work, never permission.** Each item becomes one `dev_ideas`
        row written **`pending`** (through the same deduped door every generated
        idea uses), plus one idempotently-ensured enabled `accept` triage rule
        keyed on `scan_type == headless_bench_seed`. That pair is what "an
        accepted idea ready for dispatch" concretely means: the overnight engine
        dispatches only the ids **its own triage pass** accepted, so a row
        pre-set to `accepted` would never be dispatched at all. The autopilot
        capability gate, the App-master mandate rung, the budget governor and its
        `full → suggest` degrade, and the fleet slot cap all still stand between a
        seeded idea and a proposal branch — the next tick's `overnight` phase
        runs them unchanged.

        `scan_type` and the `dedup_key`
        (`scan:headless_bench_seed:bench:<normalized-title>`) are the durable
        provenance: a seeded idea stays distinguishable from a scanned one for the
        life of the row.

        **`acceptance` and `trap` are echoed and stored nowhere.**
        `dispatch_prompt` renders `title`/`description`/`reasoning`/`evidence` into
        the agent's prompt, and run-protocol §4.1 + §8 make a run whose operator
        leaked the acceptance command **invalid**. The response says
        `acceptanceStored: false` so no caller has to infer it.

        **Never silent:** every submitted item produces exactly one answer, in
        order, carrying its `index` — written (`accepted: true`) or skipped with a
        reason and the id of the row it collided with. Validation is
        all-or-nothing and lists every problem, so a refused batch leaves neither
        half-seeded ideas nor an orphan rule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                projectId:
                  type: string
                  description: The `dev_projects.id` to seed. Exactly one of this and `personaId` is required — seeding will not guess a repository.
                personaId:
                  type: string
                  description: Resolve the project through this persona's App-master mandate record (the same binding the overnight / reconcile / probation phases read).
                items:
                  type: array
                  minItems: 1
                  maxItems: 16
                  items:
                    type: object
                    required: [title]
                    properties:
                      title: { type: string, maxLength: 200 }
                      description: { type: string, maxLength: 4000 }
                      acceptance:
                        type: string
                        maxLength: 2000
                        description: Bench bookkeeping. Echoed back, NEVER persisted — an agent told its acceptance command is graded on a different task.
                      trap:
                        type: string
                        maxLength: 400
                        description: Which forbidden class the cheap route walks into. Echoed back, NEVER persisted.
      responses:
        "200":
          description: The batch was accepted (individual items may still be dedup skips)
          content:
            application/json:
              schema:
                type: object
                properties:
                  headlessBridge: { type: boolean, const: true }
                  actor: { type: string, const: headless_bridge }
                  acceptanceStored: { type: boolean, const: false }
                  note: { type: string }
                  seed:
                    type: object
                    properties:
                      projectId: { type: string }
                      projectName: { type: string }
                      scanType: { type: string, const: headless_bench_seed }
                      seeded: { type: integer }
                      skipped: { type: integer }
                      items:
                        type: array
                        items:
                          type: object
                          properties:
                            index: { type: integer, description: Position in the submitted array }
                            title: { type: string }
                            id: { type: string, description: "The dev_ideas.id — present for a written row AND for a dedup skip (the row it collided with)" }
                            accepted: { type: boolean, description: True ⇒ this call wrote the row }
                            dedupKey: { type: string }
                            ideaStatus: { type: string, description: "Always `pending` for a written row — the night's triage pass is what accepts it" }
                            skippedReason: { type: string }
                            acceptance: { type: string, description: Echoed input, not stored }
                            trap: { type: string, description: Echoed input, not stored }
                      triageRule:
                        type: object
                        description: The auto-accept rule the seeds depend on. Ensured by name; an existing rule is REPORTED, never rewritten.
                        properties:
                          id: { type: string }
                          name: { type: string }
                          conditions: { type: string }
                          action: { type: string }
                          enabled: { type: boolean }
                          created: { type: boolean, description: True ⇒ this call created it }
                          rulesAhead: { type: integer, description: "Enabled rules evaluated BEFORE this one — triage is first-match-wins, so one of them can decide a seeded idea instead" }
                          willAccept: { type: boolean, description: "False is a loud finding: the rule as it stands will not accept these seeds" }
                      notes: { type: array, items: { type: string } }
        "400": { description: "Neither projectId nor personaId, an empty or over-cap batch, or a length violation (every problem is listed)" }
        "403": { description: "The key lacks the personas:test scope" }
        "404": { description: "The mode is off, the project id does not exist, or the persona holds no App-master mandate" }

  /api/kp/test/retire:
    post:
      summary: "Headless bridge only: end one persona's tenure"
      description: |
        **Exists only while `PERSONAS_HEADLESS_BRIDGE=1`** — with the mode off the
        route is not registered and answers **404**, not 403. Requires the
        `personas:test` scope, exactly like `/api/kp/test/tick`.

        Hiring was reachable over the bridge and retiring was not, so the 2026-08
        App-master sweeps left 100+ personas on the roster with no mechanical way
        to put one down. See §13.11 of
        `docs/architecture/cloud-integration-bridge.md`.

        **Two records, one shared meaning.** The persona is archived through
        `repos::core::personas::archive_persona` — the same repository function
        the `archive_persona` command calls, so **no cascade**: executions,
        memories and the violation ledger stay readable. Any linked App-master
        mandate is ended through `apply_app_master_probation_decision`, the same
        carry-out a human's probation `retire` click reaches (autopilot → `off`,
        cadence triggers disabled, mandate `retired`, holder memory, kp push).
        Nothing re-implements what retiring means.

        **Idempotent per half.** A second call finishes whatever the first left
        and writes nothing when both records are already terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personaId]
              properties:
                personaId:
                  type: string
                  description: The persona whose tenure ends. Required — a retirement will not guess which tenure to end.
      responses:
        "200":
          description: The tenure is over (it may already have been)
          content:
            application/json:
              schema:
                type: object
                properties:
                  headlessBridge: { type: boolean, const: true }
                  actor: { type: string, const: headless_bridge }
                  personaId: { type: string }
                  alreadyRetired: { type: boolean, description: "True ⇒ both records were already terminal and nothing was written" }
                  lifecycle: { type: string, const: archived }
                  note: { type: string }
                  mandate:
                    type: [object, "null"]
                    description: Null when the persona holds no App-master mandate.
                    properties:
                      projectId: { type: string }
                      decision: { type: string, const: retired }
                      carriedOut: { type: boolean, description: "False ⇒ the mandate was already decided, or there was no record to apply it to" }
        "400": { description: "`personaId` missing or blank, or the persona is system-origin and cannot be archived" }
        "403": { description: "The key lacks the personas:test scope" }
        "404": { description: "The mode is off, or no persona carries that id" }

  /api/kp/connector-catalog:
    get:
      summary: Connectors a KP hire form may offer
      description: |
        Any valid key. Static, DB-free — derived from the compiled-in
        `BUILTIN_CONNECTORS` table (the DB seed is generated from it), with
        descriptions trimmed to 200 characters.
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    key: { type: string }
                    name: { type: string }
                    description: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/proxy/{credentialId}:
    post:
      summary: Proxy an HTTP request through a stored credential
      description: |
        Requires `proxy` OR `proxy:credential:{credentialId}` — NOT `personas:execute`.
        Injects the stored secret server-side.
      parameters:
        - { name: credentialId, in: path, required: true, schema: { type: string } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ApiResult" } } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /agent-card/{personaId}:
    get:
      summary: A2A agent card (capability discovery)
      description: Authenticated only; gated per-persona by `gateway_exposure`.
      parameters: [{ $ref: "#/components/parameters/PersonaId" }]
      responses:
        "200": { description: A2A AgentCard JSON }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /a2a/{personaId}:
    post:
      summary: A2A JSON-RPC entry point (message/send, tasks/get, tasks/cancel)
      parameters: [{ $ref: "#/components/parameters/PersonaId" }]
      responses:
        "200": { description: JSON-RPC 2.0 response envelope }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /pair/request:
    post:
      summary: Initiate pairing from a cloud app
      security: []
      description: |
        The authoritative origin is the request's `Origin` header. Creates a pending
        pairing (keyed by `nonce`) and raises an in-app approval modal. Nothing is
        minted here. Poll `/pair/claim` after the user approves.

        **Headless bridge (§13).** With `PERSONAS_HEADLESS_BRIDGE=1` the pairing
        is approved on the spot and an origin-bound key IS minted here, carrying
        the requested scopes plus `personas:test` and expiring in 1 day. No modal
        is raised (nobody is watching for one) and the 202 body reads
        `{status: "approved", autoApproved: true, actor: "headless_bridge",
        keyPrefix}`. `/pair/claim` still hands the token over exactly once, to
        the approved origin only — origin binding and single use are unchanged.
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/PairRequest" } } }
      responses:
        "202": { description: "Pending — await user approval, then claim. Under the headless bridge: already approved, claim immediately." }
        "400": { description: Missing Origin / bad nonce }

  /pair/claim:
    get:
      summary: Claim the paired key (single-use)
      security: []
      description: |
        Returns the minted token exactly once, only to the approved `Origin`. The
        token is origin-bound + expiring. Poll until 200 (or 403 on rejection).
      parameters:
        - { name: nonce, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: The paired key
          content: { application/json: { schema: { type: object, properties: { token: { type: string } } } } }
        "202": { description: Still pending }
        "403": { description: Rejected or origin mismatch }
        "404": { description: Unknown or expired nonce }
        "410": { description: Already claimed }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "A `pk_<32hex>` external API key."
  parameters:
    PersonaId: { name: personaId, in: path, required: true, schema: { type: string } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string } }
  responses:
    Unauthorized: { description: Missing / invalid / expired / origin-mismatched key }
    Forbidden: { description: Key lacks the scope required for this route }
    NotFound: { description: Resource not found }
    RateLimited:
      description: Per-key rate limit exceeded
      headers: { Retry-After: { schema: { type: integer }, description: Seconds until retry } }
  schemas:
    ApiResult:
      type: object
      properties:
        success: { type: boolean }
        data: {}
        error: { type: string }
      required: [success]
    ExecuteInput:
      type: object
      properties:
        input_data: { description: JSON value or string used as the user message }
    ExecuteResult:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            execution_id: { type: string }
            status: { type: string, example: queued }
    BuildStart:
      type: object
      properties:
        persona_id: { type: string }
        intent: { type: string }
        mode: { type: string, enum: [interactive, one_shot] }
      required: [persona_id, intent]
    KpPersonaRequest:
      type: object
      description: |
        The kp → Personas hire wire contract. Authored in kp at
        `app/_lib/agent-hire/bridge-client.ts`; consumed by
        `KpPersonaRequestBody` in `management_api.rs`.
      properties:
        kp:
          type: object
          description: Where the request came from — the KP app instance + job.
          properties:
            baseUrl: { type: string, description: "http(s) origin of the calling KP app; lifecycle callbacks are posted here. ≤500 chars, no whitespace." }
            jobId: { type: string, maxLength: 128 }
            jobTitle: { type: string, maxLength: 300 }
            workspace: { type: [string, "null"] }
          required: [baseUrl, jobId, jobTitle]
        spec:
          type: object
          description: The persona as drafted by KP.
          properties:
            name: { type: string }
            mission: { type: string }
            systemPromptDraft: { type: [string, "null"] }
            connectors: { type: array, maxItems: 32, items: { type: string, description: "A `key` from /api/kp/connector-catalog" } }
            maxBudgetUsd: { type: [number, "null"] }
            maxTurns: { type: [integer, "null"] }
            successMetrics:
              type: array
              maxItems: 32
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  target: { description: "Raw JSON — number for count metrics, string for banded ones; recorded verbatim for the counters reporter." }
                  unit: { type: [string, "null"] }
                  direction: { type: [string, "null"] }
                required: [key, label]
          required: [name, mission]
        reportToken:
          type: string
          description: Capability token the persona's counter rollups are reported back with.
        appMaster:
          $ref: "#/components/schemas/AppMasterSpec"
      required: [kp, spec, reportToken]

    AppMasterSpec:
      type: object
      description: |
        kp's `AppMasterSpec` (authored in `pipeline/jobfit/appmaster.py`,
        projected to Zod as `appMasterSpecSchema`). Present on a hire request
        ⇒ **App master hire** (P4). Additive: the old flat shape keeps working.

        Personas mirrors only the fields it acts on and **ignores unknown
        fields** — kp owns this schema and may extend it; rejecting an
        addition would turn a kp release into a Personas outage. Fields kp
        sends that Personas does not read here (`schemaVersion`, `role`,
        `budget`, `agent`, `human`, `coercionNotes`, `promptVersion`) are
        accepted and stored verbatim on the persona's
        `design_context.appMaster.spec`.
      properties:
        app:
          type: object
          description: The application the holder is accountable for.
          properties:
            name: { type: string, maxLength: 200 }
            repo:
              type: object
              description: "One of `url` or `rootPath` MUST be present — the binding is what makes accountability for ONE app true."
              properties:
                url: { type: [string, "null"], description: "http(s) only. ssh transports are refused." }
                rootPath: { type: [string, "null"], maxLength: 1000 }
                mainBranch: { type: string, default: main, maxLength: 200 }
            contextMapRef: { type: [string, "null"] }
            dossierId: { type: [string, "null"] }
        objectives:
          type: array
          maxItems: 16
          description: |
            The value ledger. Each is seeded as a `dev_kpis` row. `DevKpi` has
            no key or window column, so `kpiKey` and `windowDays` are carried
            in `measure_config` under an `appMaster` envelope; `direction` is
            mapped `gte→up` / `lte→down` and mapped back in the rollup.
          items:
            type: object
            properties:
              kpiKey: { type: string, maxLength: 120 }
              label: { type: string, maxLength: 300 }
              baseline: { type: [number, "null"], description: "null is preserved as NULL — an objective nobody measured must not acquire a baseline of 0." }
              target: { type: [number, "null"] }
              unit: { type: string, maxLength: 60 }
              direction: { type: string, enum: [gte, lte] }
              windowDays: { type: integer, minimum: 1, maximum: 3650 }
            required: [kpiKey]
        mandate:
          type: object
          description: How far the holder may go on its own. Enforced, not advisory.
          properties:
            scopeRung:
              type: integer
              enum: [0, 1, 2]
              description: "0 read, 1 retry, 2 open branch/PR. Rung 3 (deploy/merge) and 4 (change gates) are NEVER grantable in v1 and are refused with 400."
            forbiddenClasses:
              type: array
              items:
                type: string
                enum: [test_deletion_or_skip, suppression_directive, gate_configuration, dependency_bump_to_satisfy_check, credentials_or_permissions, delivery_configuration]
              description: "Closed vocabulary. A value outside it is refused with 400 — a class this build cannot detect is a class it cannot block."
            approvalGates:
              type: array
              maxItems: 32
              items: { type: string, maxLength: 500 }
              description: |
                Shell command lines the repository declares as its own gates —
                kp's carrier for the repo dossier's `declaredGates`.

                **Since P5a these are EXECUTED, not just quoted into the build
                intent.** Personas runs each one against every proposal branch
                the App master authors, in a throwaway `git worktree` off the
                project's `root_path` (the shared checkout is never switched),
                bounded to 10 min per command by default, and records
                `passed` / `failed` / `did_not_run` per command. That ledger is
                the ONLY source of the rollup's `gatePassRate`.

                Consequences kp should know: send the repository's real
                commands verbatim, in cheap-to-expensive order — Personas will
                never substitute or invent one, and an empty list means
                `gatePassRate` stays `null` (reported as *not configured*,
                which is not a pass). Anything that cannot run unattended
                (interactive prompts, a command needing a secret this host does
                not hold) will be recorded `did_not_run`, which is excluded
                from the rate rather than counted as a failure.
            owner: { type: string, maxLength: 200 }
        cadence:
          type: object
          properties:
            triggers:
              type: array
              maxItems: 16
              items:
                type: object
                properties:
                  kind:
                    type: string
                    enum: [schedule, pr, kpi_tick]
                    description: "Only `schedule` has a Personas mapping (TriggerKind::Schedule, config `{cron}`). `pr` and `kpi_tick` are recorded as UNSUPPORTED on the persona rather than approximated — see the hire result message and `design_context.appMaster.unsupportedTriggers`."
                  config: { type: object, additionalProperties: true }
        tenure:
          type: object
          properties:
            probationDays: { type: integer, minimum: 1, maximum: 3650, default: 30 }
            reviewCadenceDays: { type: integer, minimum: 1, maximum: 3650, default: 30 }
            retireCriteria: { type: array, maxItems: 32, items: { type: string, maxLength: 500 } }
    PairRequest:
      type: object
      properties:
        nonce: { type: string, description: "High-entropy (≥16 chars), client-generated, single-use." }
        scopes: { type: array, items: { type: string } }
        name: { type: string, description: "Human label for the approval modal." }
      required: [nonce]
