<!doctype html>
<html lang="en" data-lang="en" data-theme="dark-midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Monitor · Mandate lanes</title>
<link rel="stylesheet" href="../data/ui/tokens.css">
<link rel="stylesheet" href="../data/ui/typography.css">
<link rel="stylesheet" href="./monitor.css">
<link rel="stylesheet" href="./cards.css">
<style>
/* ── Lane strip: replaces DecisionHub's seven chips + ready (CommandBar.tsx:115) ── */
.lanes { display: flex; gap: 6px; align-items: center; }
.lane { display: inline-flex; align-items: center; gap: 8px; padding: 5px 11px; border-radius: var(--radius-input); cursor: pointer; }
.lane .w { font-size: .9375rem; }
.lane .typo-data { min-width: 1.2em; text-align: right; }
.lane.is-open { box-shadow: 0 0 0 2px var(--primary); }
.lane.bump { animation: ae-flash 900ms ease-out 2; }
.yield { display: flex; gap: 14px; align-items: center; font-size: .9375rem; padding-left: 10px; border-left: 1px solid var(--ae-edge); }
.yield b { font-variant-numeric: tabular-nums; }
.dayclock { display: inline-flex; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
.dayclock .play { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; }

/* ── Peek: the lane's list, the same place today's chip peeks open ── */
.peek { position: absolute; z-index: 40; top: 118px; max-height: calc(100vh - 190px); display: none; flex-direction: column; border-radius: var(--radius-modal); }
.peek.open { display: flex; }
.peek .ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--ae-edge); }
.peek .rows { overflow: auto; padding: 0 0 4px; }
.peek .row { display: grid; gap: 2px 10px; cursor: pointer; align-items: start; }
.peek .row .t { font-weight: 600; }
.peek .row .s { grid-column: 2 / 4; font-size: .875rem; }
.peek .pf { border-top: 1px solid var(--ae-edge); padding: 9px 14px; display: flex; gap: 14px; flex-wrap: wrap; font-size: .875rem; color: var(--muted-foreground); }
.peek .more { padding: 10px 14px; font-size: .875rem; }

/* ── Stewards plate: replaces the Autopilot plate (SupplyDeck.tsx) ── */
.stw .row { display: grid; grid-template-columns: 52px 1fr 12px; gap: 2px 8px; align-items: center; padding: 6px 2px; cursor: pointer; border-radius: 6px; }
.stw .row:hover { background: var(--ae-glass-hi); }
.stw .id { font-family: var(--font-mono); font-size: .875rem; color: color-mix(in srgb, var(--primary) 70%, var(--foreground)); }
.stw .bar2 { grid-column: 2 / 4; }

/* ── Ribbon above the bays: the fleet's yield in one sentence ── */
.ribbon { display: flex; align-items: center; gap: 18px; padding: 10px 14px; border-radius: var(--radius-card); margin-bottom: 10px; }
.ribbon .big { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.ribbon .lab { font-size: .9375rem; color: var(--muted-foreground); }
.ribbon .vs { display: flex; flex-direction: column; }
.ribbon .note { margin-left: auto; font-size: .875rem; color: var(--muted-foreground); text-align: right; }

/* ── Drawer: levels two and three (register, mandate page, ledger, orphanage) ── */
.drawer { position: fixed; z-index: 55; top: 116px; right: 0; bottom: 40px; width: min(1100px, 82vw); display: none; flex-direction: column; border-radius: var(--radius-modal) 0 0 var(--radius-modal); }
.drawer.open { display: flex; }
.drawer .dh { padding: 12px 18px; border-bottom: 1px solid var(--ae-edge); display: flex; gap: 12px; align-items: center; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { text-align: left; font-size: .875rem; color: var(--muted-foreground); font-weight: 600; padding: 8px; border-bottom: 1px solid var(--ae-edge); position: sticky; top: 0; z-index: 1; background: color-mix(in srgb, var(--background) 96%, var(--foreground)); }
.tbl td { padding: 9px 8px; border-top: 1px solid var(--ae-edge); vertical-align: top; }
.tbl tr { cursor: pointer; }
.tbl tr:hover td { background: color-mix(in srgb, var(--foreground) 3%, transparent); }
.facts.wide { grid-template-columns: 150px minmax(0, 1fr); } .facts.wide dd { text-align: left; }
.ticker { display: flex; gap: 10px; align-items: center; min-width: 0; flex: 1; overflow: hidden; }
.ticker span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ticker .fresh { color: var(--foreground); }
.before .pline.needs, .before .pline.critical { outline: 2px dashed color-mix(in srgb, var(--foreground) 40%, transparent); }
</style>
</head>
<body>
<div class="mon" id="mon"></div>
<div class="peek ae-plate" id="peek" role="dialog" aria-label="Lane"></div>
<div class="scrim" id="scrim"></div>
<div class="deck" id="deck" role="dialog" aria-modal="true" aria-labelledby="deck-title"></div>
<div class="drawer ae-plate" id="drawer" role="dialog" aria-label="Mandates"></div>

<script src="../data/decisions.js"></script>
<script src="../data/ui/fleet.js"></script>
<script src="./model.js"></script>
<script src="./chrome.js"></script>
<script src="./parts.js"></script>
<script>
(function () {
  'use strict';
  var Mx = window.Mandates, C = window.Chrome, Pt = window.Parts, esc = Mx.esc, ago = Mx.ago, kbd = Pt.kbd, G = Pt.G;
  var which = Mx.fleetChoice();
  var M = Mx.create(window.DECISIONS, which);
  var FLEET = window.FLEET[which];
  var before = (function () { var n = 0; FLEET.personas.forEach(function (p) { if (p.pile === 'needs') n++; }); return n; })();
  var $ = function (id) { return document.getElementById(id); };
  var each = function (root, sel, fn) { Array.prototype.forEach.call(root.querySelectorAll(sel), fn); };
  var plural = function (n, w, ws) { return n + ' ' + (n === 1 ? w : (ws || w + 's')); };

  var LANES = [
    { key: 'breach', n: '1', label: 'Breach', types: ['breach', 'valve'], hint: 'an envelope was hit, or a valve (outbound, deletion) needs you' },
    { key: 'sign', n: '2', label: 'Sign', types: ['sign'], hint: 'a drafted mandate waits for your signature' },
    { key: 'accept', n: '3', label: 'Accept', types: ['claim'], hint: 'a steward says a mandate is met' },
    { key: 'talk', n: '4', label: 'Talk', types: ['talk'], hint: 'conversation, not a decision' }
  ];
  var MERGE_ORDER = ['never', 'gate-green+council-ready', 'gate-green'];
  var MERGE_OPT = { never: ['Never', 'every merge asks you'], 'gate-green+council-ready': ['Gate + council', 'lands on green gates and a ready council'], 'gate-green': ['Gate green', 'lands when the project gates pass'] };
  var QUICK = ['Looks good, go ahead', 'Not now, park it', 'Send me the diff first'];
  var S = { lane: null, sel: 0, deck: null, drawer: null, before: false, prevCounts: {}, ticker: [],
    armed: null, prompt: null, picks: null, foc: 0, reader: null, edit: false, form: null, receipt: null, busy: false, lastKey: null, landed: 0 };

  function laneAsks(l) {
    return M.openAsks().filter(function (a) { return l.types.indexOf(a.type) >= 0; }).sort(function (a, b) {
      return (b.stopTheLine - a.stopTheLine) || ((b.type === 'valve') - (a.type === 'valve')) || M.askOrder(a, b);
    });
  }
  function laneOf(key) { return LANES.filter(function (l) { return l.key === key; })[0]; }
  function laneItems(l) { return laneAsks(l).reduce(function (s, a) { return s + Math.max(1, a.items.length); }, 0); }
  function laneOfAsk(a) { return LANES.filter(function (x) { return x.types.indexOf(a.type) >= 0; })[0]; }
  function waitOf(it) { return ago(Date.parse(it.createdAt), M.simMs) + ' waiting'; }
  function actAgo(a) { return ago(a.at, M.simMs); }

  // ── One line per card, for the peek: what kind, the ask, what it unblocks
  function askHead(a) {
    var m = a.mandate, n = a.items.length, more = n > 1 ? '  +' + (n - 1) + ' like it' : '';
    if (a.type === 'breach') {
      var req = M.clauseRequest(a);
      if (a.sub === 'stop') return { kicker: 'Stop the line · ' + m.id, title: a.items[0].title + more, ask: req.amend + ', or keep the line stopped', tone: 'err' };
      if (a.sub === 'risk') return { kicker: M.CLAUSE[a.sub].label + ' · ' + m.id, title: a.items[0].title + more, ask: req.amend + ': a person reads these, not the steward', tone: 'warn' };
      return { kicker: M.CLAUSE[a.sub].label + ' · ' + m.id, title: req.amend, ask: a.items[0].title + more, tone: a.stopTheLine ? 'err' : 'warn' };
    }
    if (a.type === 'valve') return { kicker: 'Valve · ' + M.VALVE[a.sub] + ' · ' + m.id, title: (a.sub === 'deletion' ? 'Delete ' + plural(n, 'item') : 'Send ' + plural(n, 'outbound message')), ask: a.items[0].title + (n > 1 ? '  +' + (n - 1) + ' more' : ''), tone: 'err' };
    if (a.type === 'claim') { var lock = M.claimLock(m); return { kicker: 'Claim · ' + m.id, title: m.intent, ask: lock ? lock : 'UAT passed and the council is ready: you can accept now', tone: 'ok' }; }
    if (a.type === 'sign') return { kicker: 'Draft by Athena · ' + m.id, title: m.intent, ask: 'Signing releases ' + plural(m.held.length, 'held item'), tone: 'info' };
    return { kicker: 'Message · ' + a.items[0].source.persona, title: a.items[0].title, ask: Pt.firstLine(a.items[0].body), tone: 'info' };
  }
  function askSub(a) {
    var m = a.mandate, bits = [];
    if (m) bits.push(m.steward);
    bits.push(ago(a.updatedAt, M.simMs) + ' ago');
    return bits.join(' · ');
  }

  // ── Frame (level one: unchanged from round 2)
  function render() {
    $('mon').innerHTML =
      C.header(which) +
      '<div class="cmd">' + '<span class="mode" title="Activity">' + C.SVG.pulse + '</span>' + C.census(FLEET, !S.before) + lanesHtml() + yieldHtml() +
      '<span class="dayclock" style="margin-left:auto">' + dayHtml() + '</span>' +
      '<span class="seg" style="margin-left:6px"><button class="on">Classic</button><button>Lanes</button></span></div>' +
      '<div class="body"><aside class="supply">' + C.sessionsPlate(FLEET) + stewardsPlate() + C.usagePlate(FLEET) + '</aside>' +
      '<main class="board' + (S.before ? ' before' : '') + '">' + ribbonHtml() + baysHtml() + '</main></div>' +
      '<footer class="dock"><span class="prompt">&gt;_</span><span class="ticker" id="ticker">' + tickerHtml() + '</span>' +
      '<span class="right"><span><i class="ae-lamp is-lit ae-t-warn" style="width:7px;height:7px"></i> ' + M.itemsToYou() + ' to you</span><span><i class="ae-lamp is-lit ae-t-run" style="width:7px;height:7px"></i> ' + M.stats.stewardActs + ' steward acts</span><span class="muted"><kbd>?</kbd> keys</span></span></footer>';
    bindFrame();
    if (S.lane) renderPeek();
  }
  function lanesHtml() {
    return '<div class="lanes" role="group" aria-label="Mandate lanes">' + LANES.map(function (l) {
      var asks = laneAsks(l), n = asks.length, stop = asks.some(function (a) { return a.stopTheLine; }), valves = asks.filter(function (a) { return a.type === 'valve'; }).length;
      var tone = l.key === 'breach' ? (stop || valves ? 'err' : 'warn') : l.key === 'accept' ? 'ok' : 'info';
      var lit = n > 0;
      var bump = S.prevCounts[l.key] != null && S.prevCounts[l.key] !== n;
      S.prevCounts[l.key] = n;
      return '<button class="lane ae-win ' + (lit ? 'is-lit ' : '') + 'ae-t-' + tone + (S.lane === l.key ? ' is-open' : '') + (bump ? ' bump' : '') + '" data-lane="' + l.key + '" title="' + esc(l.hint) + '">' +
        '<kbd>' + l.n + '</kbd><i class="ae-lamp ' + (lit ? 'is-lit' : '') + '"></i><span class="w">' + l.label + '</span><span class="typo-data">' + n + '</span>' +
        (l.key === 'breach' && valves ? '<span class="dim" style="font-size:.875rem">' + valves + ' valve' + (valves === 1 ? '' : 's') + '</span>' : '') + '</button>';
    }).join('') +
      '<button class="lane ae-win ae-t-off" data-drawer="orphans" title="Work no mandate claims: read as one line, never a lane"><kbd>O</kbd><span class="w dim">Orphans</span><span class="typo-data dim">' + M.orphans.length + '</span></button></div>';
  }
  function yieldHtml() {
    return '<div class="yield" title="Design figures, derived from the dataset"><span><b>' + M.stats.stewardActs.toLocaleString() + '</b> <span class="muted">handled in envelopes</span></span><span><b>' + M.itemsToYou().toLocaleString() + '</b> <span class="muted">to you</span></span></div>';
  }
  function dayHtml() {
    var run = DAY && DAY.running();
    var left = M.stream.length - M.streamIdx;
    return '<button class="play ae-win ' + (run ? 'is-lit ae-t-run' : '') + '" id="play" title="Simulate the day (P)">' + (run ? '❚❚' : '▶') + '</button><span><kbd>P</kbd> day ' + Mx.clock(M.simMs) + ' <span class="muted">· ' + left + ' to arrive</span></span>';
  }
  function stewardsPlate() {
    var ms = M.mandates.filter(function (m) { return m.state !== 'accepted'; });
    var rank = function (m) { return Object.keys(m.asks).length * 10 + (m.state === 'suspended' ? 5 : 0); };
    ms.sort(function (a, b) { return rank(b) - rank(a) || b.acts.length - a.acts.length; });
    var active = ms.filter(function (m) { return m.state === 'active' || m.state === 'claimed'; }).length;
    var show = ms.slice(0, which === 'scale' ? 9 : 10);
    return '<section class="plate ae-plate stw"><div class="engrave" style="display:flex;justify-content:space-between;align-items:center">Stewards <span><kbd>M</kbd></span></div>' +
      '<div style="font-size:.9375rem;margin:4px 0 6px">' + active + ' envelope' + (active === 1 ? '' : 's') + ' signed · <span class="muted">replaces Autopilot</span></div>' +
      show.map(function (m) {
        var L = M.mandateLoad(m), asks = L.asks, tone = m.state === 'suspended' ? 'off' : asks ? 'warn' : m.state === 'draft' ? 'info' : 'run';
        return '<div class="row ae-t-' + tone + '" data-mandate="' + m.id + '" title="' + esc(m.intent) + '"><span class="id">' + m.id + '</span><span class="clamp1" style="font-size:.9375rem">' + esc(m.intent) + '</span><i class="ae-lamp ' + (asks || m.state === 'draft' ? 'is-lit' : '') + '"></i>' +
          '<div class="bar2"><div class="ae-bar ' + (L.spendPct > 85 ? 'ae-t-warn' : 'ae-t-run') + '"><span style="width:' + L.spendPct + '%"></span></div></div></div>';
      }).join('') + (ms.length > show.length ? '<div class="dim" style="font-size:.875rem;margin-top:4px">+' + (ms.length - show.length) + ' more in the register</div>' : '') + '</section>';
  }
  function ribbonHtml() {
    var cards = M.openAsks().length;
    return '<div class="ribbon ae-plate">' +
      '<div class="vs"><span class="big">' + M.stats.arrived.toLocaleString() + '</span><span class="lab">items the fleet produced</span></div>' +
      '<div class="vs"><span class="big" style="color:color-mix(in srgb,var(--primary) 70%,var(--foreground))">' + M.stats.stewardActs.toLocaleString() + '</span><span class="lab">decided by stewards inside envelopes you signed</span></div>' +
      '<div class="vs"><span class="big" style="color:var(--status-warning-raw)">' + cards + '</span><span class="lab">cards for you (' + M.itemsToYou() + ' items)</span></div>' +
      '<div class="vs"><span class="big dim">' + M.orphans.length + '</span><span class="lab">orphans, no mandate</span></div>' +
      '<div class="note">Agent lines stay dark: stewards hold their items.<br>A nameplate lights when its mandate holds a card for you.<br><kbd>B</kbd> ' + (S.before ? '<b>showing today\'s lamps (' + before + ' agents lit)</b>' : 'compare with today\'s lamps') + '</div></div>';
  }
  // After mandates a persona line never carries a need: its items go to a steward, and
  // what reaches you is a mandate card. The bay's NAMEPLATE lights when a mandate covering
  // the project holds a card for you; a project no mandate covers says so.
  function baysHtml() {
    var handled = {};
    M.acts.forEach(function (a) { var k = a.item.source.personaId; handled[k] = (handled[k] || 0) + 1; });
    var orphanProjects = {}; M.orphans.forEach(function (it) { orphanProjects[it.source.project] = 1; });
    return C.bays(FLEET, function (p) {
      if (S.before) {
        if (p.pile === 'needs') return { cls: p.needTone === 'critical' ? 'critical' : 'needs', count: p.needs.reduce(function (s, n) { return s + n.count; }, 0), title: 'Today: needs you' };
        return { cls: p.pile === 'working' ? 'working' : p.pile === 'off' ? 'off' : 'quiet' };
      }
      var cls = p.enabled === false ? 'off' : p.running ? 'working' : 'quiet';
      if (p.pile === 'needs' && p.needTone === 'critical') cls = 'critical';
      return { cls: cls, count: handled[p.id] ? '<span class="dim" style="font-weight:400">' + handled[p.id] + '</span>' : '', title: (handled[p.id] || 0) + ' of its items were decided by a steward' };
    }, { maxLines: which === 'scale' ? 6 : 99, nameplate: S.before ? null : function (t) {
      var ms = (M.byProject[t.name] || []).filter(function (m) { return m.state !== 'accepted'; });
      if (!ms.length) return '<span class="n dim" style="font-weight:400;font-size:.875rem">' + (orphanProjects[t.name] ? 'no mandate' : '') + '</span><i class="ae-lamp ae-t-off"></i>';
      var asks = ms.reduce(function (s, m) { return s + Object.keys(m.asks).length; }, 0);
      return '<span class="n" style="font-weight:400;font-size:.875rem"><span class="typo-code" style="color:color-mix(in srgb,var(--primary) 70%,var(--foreground))">' + ms[0].id + (ms.length > 1 ? ' +' + (ms.length - 1) : '') + '</span>' + (asks ? ' · ' + asks + ' card' + (asks === 1 ? '' : 's') : '') + '</span><i class="ae-lamp ' + (asks ? 'is-lit ae-t-warn' : 'ae-t-run') + '"></i>';
    } });
  }
  function tickerHtml() {
    if (!S.ticker.length) return '<span class="dim">Describe the task to dispatch…</span><span class="muted">· steward acts scroll here as they happen</span>';
    return S.ticker.slice(0, 3).map(function (t, i) { return '<span class="' + (i === 0 ? 'fresh' : 'dim') + '">' + esc(t) + '</span>'; }).join('<span class="dim">·</span>');
  }
  function bindFrame() {
    each(document, '[data-lane]', function (b) { b.onclick = function () { openLane(b.dataset.lane); }; });
    each(document, '[data-mandate]', function (b) { b.onclick = function () { openDrawer({ view: 'mandate', m: M.byId[b.dataset.mandate], sel: 0 }); }; });
    each(document, '[data-drawer]', function (b) { b.onclick = function () { openDrawer({ view: b.dataset.drawer, sel: 0 }); }; });
    var p = $('play'); if (p) p.onclick = function () { DAY.toggle(); };
  }

  // ── Peek (level 1 → list): each row says the ask, so the operator decides what to open
  function openLane(key) { if (S.lane === key) { closeLane(); return; } S.lane = key; S.sel = 0; render(); }
  function closeLane() { S.lane = null; $('peek').classList.remove('open'); render(); }
  function groupOf(a) { return a.stopTheLine ? 'Stop the line' : a.type === 'valve' ? 'Valves: you read each one' : a.type === 'breach' ? 'Envelope clauses' : null; }
  function renderPeek() {
    var l = laneOf(S.lane), asks = laneAsks(l), el = $('peek');
    var btn = document.querySelector('[data-lane="' + l.key + '"]');
    el.style.left = Math.max(12, Math.min(window.innerWidth - 700, (btn ? btn.getBoundingClientRect().left : 300) - 20)) + 'px';
    var cap = 150, shown = asks.slice(0, cap), lastG = null;
    var counts = {}; asks.forEach(function (a) { var g = groupOf(a); if (g) counts[g] = (counts[g] || 0) + 1; });
    S.sel = Math.min(S.sel, Math.max(0, asks.length - 1));
    el.innerHTML = '<div class="ph"><div class="crumbs"><span>Activity</span><span class="sep"></span><b>' + l.label + ' lane</b><span class="dim">· ' + plural(asks.length, 'card') + ', ' + laneItems(l) + ' items · ordered by what each unblocks</span></div></div>' +
      '<div class="rows" role="listbox" aria-label="' + l.label + ' lane">' + (shown.length ? shown.map(function (a, i) {
        var hd = askHead(a), g = groupOf(a), gh = '';
        if (g && g !== lastG) { gh = '<div class="grp"><span class="typo-eyebrow">' + esc(g) + '</span><span class="typo-caption">' + counts[g] + '</span></div>'; lastG = g; }
        return gh + '<div class="row ae-line ' + (i === S.sel ? 'is-selected ' : '') + 'is-lit ae-t-' + hd.tone + (a.fresh && M.simMs - a.fresh < 3 * 3600e3 ? ' is-flash' : '') + '" data-i="' + i + '" role="option" aria-selected="' + (i === S.sel) + '"><i class="ae-lamp is-lit" style="margin-top:5px"></i>' +
          '<span style="min-width:0"><span class="k ae-tone-text">' + esc(hd.kicker) + '</span><br><span class="t clamp1" style="display:block">' + esc(hd.title) + '</span></span>' +
          '<span class="ub"><b>' + M.unblocks(a) + '</b><span>unblocks</span></span>' +
          '<span class="ak clamp1">' + esc(hd.ask) + '</span><span class="s dim">' + esc(askSub(a)) + '<span class="open">· ' + kbd('Enter') + ' opens the card</span></span></div>';
      }).join('') : '<div class="more dim">Nothing in this lane. Stewards are handling everything inside their envelopes.</div>') +
      (asks.length > cap ? '<div class="more dim">+' + (asks.length - cap) + ' more cards, same order. <kbd>/</kbd> finds one by mandate, title or clause.</div>' : '') + '</div>' +
      '<div class="pf"><span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>Enter</kbd> open card</span><span><kbd>1</kbd>–<kbd>4</kbd> lanes</span><span><kbd>←</kbd><kbd>→</kbd> next lane</span><span><kbd>Esc</kbd> close</span></div>';
    el.classList.add('open');
    each(el, '.row', function (r) { r.onclick = function () { S.sel = +r.dataset.i; openDeck(S.lane, asks[S.sel].key); }; });
    var selEl = el.querySelector('.row.is-selected'); if (selEl) selEl.scrollIntoView({ block: 'nearest' });
  }

  // ── Deck (level 3). One fixed frame: head, body, rail; the dock never moves.
  function resetCard() { S.armed = null; S.prompt = null; S.picks = null; S.foc = 0; S.reader = null; S.edit = false; S.form = null; }
  function openDeck(lane, key) {
    S.lane = null; $('peek').classList.remove('open');
    S.deck = { lane: lane, key: key, dir: 1 }; resetCard(); S.receipt = null; S.landed = 0; S.lastKey = null;
    $('scrim').classList.add('open'); render(); renderDeck();
  }
  function closeDeck(toLane) {

        else if (k === '1' || k === '2' || k === '3') quickReply(+k - 1);
        return;
      }
      return;
    }
    if (S.drawer) {
      var d = S.drawer, cnt = (d.list || []).length, lw = k.length === 1 ? k.toLowerCase() : k;
      if (k === 'Escape') { if (S.armed) { S.armed = null; renderDrawer(); } else if (d.edit) { d.edit = false; d.form = null; renderDrawer(); } else closeDrawer(); return; }
      if (lw === 'j' || k === 'ArrowDown') { e.preventDefault(); d.sel = Math.min(cnt - 1, d.sel + 1); S.armed = null; renderDrawer(); return; }
      if (lw === 'k' || k === 'ArrowUp') { e.preventDefault(); d.sel = Math.max(0, d.sel - 1); S.armed = null; renderDrawer(); return; }
      if (k === 'Enter') { drawerEnter(); return; }
      if (lw === 'v' && (d.view === 'mandate' || d.view === 'ledger')) { drawerAct('revert'); return; }
      if (lw === 'n' && (d.view === 'mandate' || d.view === 'ledger')) { drawerAct('narrow'); return; }
      if (lw === 'f') { var map = d.view === 'register' ? REG_F : d.view === 'ledger' ? LEDGER_F : d.view === 'mandate' ? PAGE_F : null; if (map) { var ks = Object.keys(map); d.filter = ks[(ks.indexOf(d.filter || 'all') + 1) % ks.length]; d.sel = 0; renderDrawer(); } return; }
      if (lw === 'e' && d.view === 'mandate') { e.preventDefault(); drawerAct('edit'); return; }
      if (lw === 's' && d.view === 'mandate' && d.m.state !== 'accepted') { drawerAct('suspend'); return; }
      if (lw === 'x' && d.view === 'orphans') { dropOrphans(); return; }
      if (lw === 'm') { openDrawer({ view: 'register', sel: 0 }); return; }
      if (lw === 'l') { openDrawer({ view: 'ledger', sel: 0 }); return; }
      if (lw === 'o') { openDrawer({ view: 'orphans', sel: 0 }); return; }
      return;
    }
    if (S.lane) {
      var asks = laneAsks(laneOf(S.lane));
      if (k === 'Escape') { closeLane(); return; }
      if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); S.sel = Math.min(asks.length - 1, S.sel + 1); renderPeek(); return; }
      if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); S.sel = Math.max(0, S.sel - 1); renderPeek(); return; }
      if (k === 'Enter' && asks.length) { openDeck(S.lane, asks[S.sel].key); return; }
      if (k === 'ArrowRight' || k === 'ArrowLeft') { var i = LANES.indexOf(laneOf(S.lane)); S.lane = LANES[(i + (k === 'ArrowRight' ? 1 : 3)) % 4].key; S.sel = 0; render(); return; }
    }
    if (k === 'Escape') { HELP.close(); return; }
    var lane = LANES.filter(function (l) { return l.n === k; })[0];
    if (lane) { openLane(lane.key); return; }
    if (k === 'm' || k === 'M') { openDrawer({ view: 'register', sel: 0 }); return; }
    if (k === 'l' || k === 'L') { openDrawer({ view: 'ledger', sel: 0 }); return; }
    if (k === 'o' || k === 'O') { openDrawer({ view: 'orphans', sel: 0 }); return; }
    if (k === 'b' || k === 'B') { S.before = !S.before; render(); return; }
  });
  $('scrim').onclick = function () { if (S.busy) return; if (S.deck) closeDeck(); else if (S.drawer) { S.drawer.back = null; closeDrawer(); } };
  window.addEventListener('resize', function () { if (S.lane) renderPeek(); });
  render();
})();
</script>
