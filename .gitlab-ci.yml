# GitLab CI/CD Pipeline for Personas Desktop
# Parallel CI option alongside GitHub Actions (.github/workflows/ci.yml)
#
# THIS FILE IS A MIRROR, NOT A SOURCE OF TRUTH. `.github/workflows/ci.yml` is
# the primary pipeline; every flag and failure mode below is copied from it.
# An unchecked mirror rots into contradicting its primary — this one did: it
# carried `2>/dev/null || true` on the binding export (the exact silent mask
# the GitHub job removed, with a comment saying why) and ran cargo without
# `--workspace --features desktop`, so its Rust jobs compiled and checked far
# less than they appeared to. Re-aligned 2026-08-28.
#
# When you change a cargo/npm invocation in `.github/workflows/ci.yml`, change
# it here in the same commit, or delete this file.

stages:
  - lint
  - test
  - security
  - build-check
  - binding-drift
  - report

# ── Variables ────────────────────────────────────────────────────────────
variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.rustup
  CARGO_MANIFEST: src-tauri/Cargo.toml

# ── Cache templates ──────────────────────────────────────────────────────
.node-cache: &node-cache
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull

.rust-cache: &rust-cache
  key:
    files:
      - src-tauri/Cargo.lock
  paths:
    - .cargo/registry/
    - .cargo/git/
    - src-tauri/target/
  policy: pull

# ── Reusable before_script snippets ─────────────────────────────────────
.install-node: &install-node
  image: node:22
  before_script:
    - npm ci --prefer-offline

.install-rust: &install-rust
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq
        libwebkit2gtk-4.1-dev
        libappindicator3-dev
        librsvg2-dev
        patchelf
        libgtk-3-dev
        libsoup-3.0-dev
        libjavascriptcoregtk-4.1-dev
    - rustup component add clippy

# ═══════════════════════════════════════════════════════════════════════
# Stage 1: Lint
# ═══════════════════════════════════════════════════════════════════════

frontend-lint:
  stage: lint
  <<: *install-node
  cache:
    <<: *node-cache
    policy: pull-push
  script:
    - npm run lint

rust-lint:
  stage: lint
  <<: *install-rust
  cache:
    <<: *rust-cache
    policy: pull-push
  script:
    # --workspace + --features desktop mirror .github/workflows/ci.yml:339.
    # Without --workspace only the root crate is linted (the crate split moved
    # most code into personas-core/db/engine); without --features desktop the
    # tauri build script aborts and nothing is linted at all.
    - cargo clippy --workspace --manifest-path $CARGO_MANIFEST --features desktop -- -D warnings

# ═══════════════════════════════════════════════════════════════════════
# Stage 2: Test
# ═══════════════════════════════════════════════════════════════════════

frontend-test:
  stage: test
  <<: *install-node
  cache:
    <<: *node-cache
  script:
    - npm run test -- --run

rust-test:
  stage: test
  <<: *install-rust
  cache:
    <<: *rust-cache
  script:
    # Mirrors .github/workflows/ci.yml:331 — see the clippy note above for why
    # --workspace and --features desktop are load-bearing rather than tidiness.
    - cargo test --workspace --manifest-path $CARGO_MANIFEST --features desktop --no-fail-fast

# ═══════════════════════════════════════════════════════════════════════
# Stage 3: Security
# ═══════════════════════════════════════════════════════════════════════

cargo-audit:
  stage: security
  image: rust:latest
  before_script:
    - cargo install cargo-audit --locked
  script:
    - cargo audit --file src-tauri/Cargo.lock
  allow_failure: true

npm-audit:
  stage: security
  <<: *install-node
  cache:
    <<: *node-cache
  script:
    - npm audit --audit-level=high
  allow_failure: true

security-deep:
  stage: security
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq nodejs npm
    - npm ci --prefer-offline
    - cargo install cargo-audit --locked || true
  script:
    - bash scripts/security-audit.sh
  artifacts:
    when: always
    reports:
      junit: security-results/security-audit.xml
    paths:
      - security-results/
  allow_failure: true

# GitLab-provided security scanning templates
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# ═══════════════════════════════════════════════════════════════════════
# Stage 4: Build check
# ═══════════════════════════════════════════════════════════════════════

typecheck:
  stage: build-check
  <<: *install-node
  cache:
    <<: *node-cache
  script:
    - npm run build

# ═══════════════════════════════════════════════════════════════════════
# Stage 5: Binding drift
# ═══════════════════════════════════════════════════════════════════════

check-bindings:
  stage: binding-drift
  <<: *install-rust
  cache:
    <<: *rust-cache
  script:
    # Mirrors .github/workflows/ci.yml:548-587 exactly.
    #
    # Fail loudly. This line used to end in `2>/dev/null || true`, which meant a
    # Rust compile error produced no bindings, no diff, and a green gate — the
    # GitHub job removed that mask for exactly this reason.
    #
    # --workspace --features desktop are REQUIRED: --manifest-path alone selects
    # only personas-desktop (the ~200 #[ts(export)] types in personas-core are
    # never regenerated), and without the feature the tauri build script aborts
    # on "Permission updater:default not found" so zero bindings are written.
    - cargo test --workspace --manifest-path $CARGO_MANIFEST --features desktop export_bindings
    - |
      # `git diff` sees TRACKED files only, so it exits 0 for a brand-new
      # binding — which is precisely the case this gate exists for, since a NEW
      # type is what appears when a command is added. Check untracked output
      # separately or the gate is green exactly when it matters.
      NEW=$(git ls-files --others --exclude-standard src/lib/bindings/)
      if [ -n "$NEW" ]; then
        echo "New TypeScript bindings were generated but not committed. Add them:"
        echo "$NEW"
        exit 1
      fi
      if ! git diff --quiet src/lib/bindings/; then
        echo "TypeScript bindings are out of date."
        echo "Run 'cargo test --workspace --manifest-path src-tauri/Cargo.toml --features desktop export_bindings' locally and commit the changes."
        echo "(Without --workspace --features desktop, zero bindings regenerate.)"
        git diff src/lib/bindings/
        exit 1
      fi
      echo "Bindings are up to date (no drift, no uncommitted new types)."

# ═══════════════════════════════════════════════════════════════════════
# Stage 6: Report
# ═══════════════════════════════════════════════════════════════════════

summary:
  stage: report
  image: alpine:latest
  script:
    - echo "All CI stages completed successfully."
    - echo "  - Frontend lint ✓"
    - echo "  - Rust lint (clippy) ✓"
    - echo "  - Frontend tests ✓"
    - echo "  - Rust tests ✓"
    - echo "  - Security scans ✓"
    - echo "  - TypeScript build ✓"
    - echo "  - Binding drift check ✓"
