name: Security Audit

on:
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch: # Allow manual trigger

jobs:
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked

      # cargo-audit has run against this lockfile for some time — in the
      # GitLab pipeline (.gitlab-ci.yml), which is a second forge nobody
      # watches. Advisory coverage for the Rust dependency graph should not
      # depend on which CI provider happens to be configured, so it runs here
      # too. cargo-deny reads the same advisory database but through a policy
      # file; cargo-audit is the unfiltered second opinion, which is why both
      # are worth having.
      - name: Run cargo-audit
        # `set -o pipefail` is load-bearing. Piping into tee hands the step
        # tee's exit status, not the tool's, so without it a report full of
        # advisories exits 0 and the job goes green — the same
        # gate-that-cannot-fail shape that let deny.toml sit unparseable for
        # months. The sibling deny step below had exactly this bug and is
        # fixed in the same commit.
        run: |
          set -o pipefail
          mkdir -p security-results
          cargo audit --file src-tauri/Cargo.lock 2>&1 | tee security-results/cargo-audit.txt

      - name: Run security audit
        run: bash scripts/security-audit.sh

      - name: Check dependency policies (cargo-deny)
        run: |
          set -o pipefail
          cd src-tauri && cargo deny check 2>&1 | tee ../security-results/cargo-deny.txt

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-results
          path: security-results/
          retention-days: 30
