name: Release

on:
  # Manual dispatch is the PRIMARY release path — development lands directly
  # on master (no PRs), so the pull_request trigger alone never fires on the
  # real workflow. Releasing stays a deliberate act.
  #
  # PUBLISHING IS OPT-IN. By default this workflow is a *build validation* run:
  # it builds all four platforms from the current ref and uploads the installers
  # as workflow artifacts, but does NOT bump the version, commit, tag, push, or
  # create a GitHub Release. The app is still in development; auto-tagging on
  # every run left 5 tags on origin with zero releases behind them (each run
  # pushed its tag and then died in the platform builds). Flip `publish` on
  # only when you actually intend to ship.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a release (bump version, tag, push, create GitHub Release). Leave OFF for a build-validation run."
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ─── Gate: a publish must not outrun CI ────────────────────────────────
  # GitHub Actions cannot express `needs:` across workflows, so this job asks
  # the API what CI concluded for THIS commit.
  #
  # It hard-fails only when `publish` is on. A build-validation run (the
  # default) is allowed while CI is red — that is the whole point of a
  # validation run — but it still prints the CI verdict so a red tree is never
  # invisible. Publishing off a commit whose CI never passed is the thing this
  # prevents.
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check CI conclusion for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHING: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Commit: $SHA  (publish=${PUBLISHING:-false})"
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=10"                    --jq '[.workflow_runs[] | {status,conclusion}]' 2>/dev/null || echo '[]')
          echo "CI runs for this SHA: $RUNS"
          CONCLUSION=$(echo "$RUNS" | jq -r 'map(select(.status=="completed")) | .[0].conclusion // "none"')
          echo "CI conclusion: $CONCLUSION"
          if [ "${PUBLISHING:-false}" != "true" ]; then
            echo "::notice::Build-validation run — not gating on CI (conclusion: $CONCLUSION)."
            exit 0
          fi
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Refusing to PUBLISH from a commit whose CI conclusion is '$CONCLUSION'."
            echo "Run CI to green on this SHA, or re-dispatch with publish=false for a validation build."
            exit 1
          fi
          echo "::notice::CI is green for this commit — publish permitted."

  # ─── Job 1: Resolve version + (optionally) bump, commit, tag, push ───
  version:
    needs: ci-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    outputs:
      new_version: ${{ steps.resolve.outputs.version }}
      # The ref every downstream job checks out: the fresh tag when
      # publishing, the triggering commit otherwise (no tag exists).
      ref: ${{ steps.resolve.outputs.ref }}
      publish: ${{ steps.mode.outputs.publish }}
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve release mode
        id: mode
        # Publishing requires an explicit opt-in on a manual dispatch. A merged
        # PR builds for validation but never tags — nothing should push a tag
        # as a side effect of merging while the app is pre-production.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Mode: PUBLISH — will bump, tag, push, and create a GitHub Release."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Mode: BUILD VALIDATION — no bump, no tag, no release. Installers upload as workflow artifacts."
          fi

      - name: Bump version in all files
        id: bump
        if: steps.mode.outputs.publish == 'true'
        run: |
          NEW_VERSION=$(node scripts/bump-version.mjs)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped to $NEW_VERSION"

      - name: Guard against tag collision
        if: steps.mode.outputs.publish == 'true'
        # Fail HERE (seconds in) with an actionable message instead of at
        # `git tag` — or worse, after 45 minutes of platform builds. A
        # collision means the version files on master lag existing tags
        # (the 2026 0.1.0-1 rollback stranded every release run this way):
        # fix by aligning package.json/tauri.conf.json/Cargo.toml to the
        # highest existing tag so the bump computes a fresh version.
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || \
             git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. The version files on master are behind the tag history — align them to the highest existing tag (git tag --sort=-v:refname | head -1) and re-run."
            exit 1
          fi
          echo "Tag ${TAG} is free."

      - name: Generate changelog
        id: changelog
        run: |
          BODY=$(node scripts/generate-changelog.mjs)
          # Use a delimiter to safely pass multi-line output
          EOF_MARKER=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "${EOF_MARKER}" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: steps.mode.outputs.publish == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin master --tags

      - name: Resolve version and build ref
        id: resolve
        # On a publish run the tag now exists and is what the platform jobs
        # build from. On a validation run there is no tag and package.json was
        # never touched — build the triggering commit at its current version.
        run: |
          if [ "${{ steps.mode.outputs.publish }}" = "true" ]; then
            VERSION="${{ steps.bump.outputs.new_version }}"
            REF="v${VERSION}"
          else
            VERSION=$(node -p "require('./package.json').version")
            REF="${{ github.sha }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "Building ref ${REF} at version ${VERSION}"

  # ─── Job 2: Build frontend once, share across platforms ───
  frontend:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ─── Job 3: Build native binaries on all platforms ────────
  build:
    needs: [version, frontend]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc
            label: windows-x64

          - platform: windows-latest
            rust_target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            label: windows-arm64

          - platform: macos-latest
            rust_target: universal-apple-darwin
            args: --target universal-apple-darwin
            label: macos-universal

          - platform: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
            label: linux-x64

    runs-on: ${{ matrix.platform }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: Checkout build ref
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: mozilla-actions/sccache-action@v0.0.7

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # Per-target key prevents windows-x64 and windows-arm64 (both on
          # `windows-latest`) from sharing a cache. Without this, whichever
          # arch builds first poisons `target/debug/deps/` with arch-specific
          # rlibs (e.g. ort_sys' x64 object files); the second arch then fails
          # at link time with "machine type x64 conflicts with arm64".
          key: ${{ matrix.rust_target }}
          cache-on-failure: true

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Add macOS targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Install frontend dependencies
        run: npm ci

      - name: Build with tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          GCP_CLIENT_ID: ${{ secrets.GCP_CLIENT_ID }}
          GCP_CLIENT_SECRET: ${{ secrets.GCP_CLIENT_SECRET }}
        with:
          # tauri-action creates/uploads to a GitHub Release only when tagName
          # is non-empty. On a validation run these are blank, so it builds the
          # bundles and stops — the installers are picked up by the artifact
          # upload step below instead.
          tagName: ${{ needs.version.outputs.publish == 'true' && format('v{0}', needs.version.outputs.new_version) || '' }}
          releaseName: ${{ needs.version.outputs.publish == 'true' && format('Personas v{0}', needs.version.outputs.new_version) || '' }}
          releaseBody: ${{ needs.version.outputs.publish == 'true' && needs.version.outputs.changelog || '' }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          tauriScript: npx tauri
          beforeBuildCommand: ""

      - name: Verify ONNX Runtime DLL is bundled (Windows)
        # ort/fastembed's `ort-download-binaries` feature is the only path
        # placing onnxruntime.dll next to the exe. If it's ever silently
        # turned off (e.g. by enabling ort's `load-dynamic` feature, which
        # the Cargo.toml comment warns against), the build still succeeds
        # but the app crashes at boot with "ONNX Runtime binary not found".
        # Fail the release here instead of in users' hands.
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: node scripts/verify-onnxruntime-bundling.mjs --target ${{ matrix.rust_target }}

      - name: Report build sizes
        if: matrix.label == 'windows-x64'
        run: node scripts/binary-size-report.mjs --target ${{ matrix.rust_target }} --budget 100

      - name: Upload installers (build-validation runs)
        # Without a release to upload to, the bundles would be discarded when
        # the runner is torn down and the run would prove only "it compiled".
        # Keep them downloadable so a validation run is also a testable build.
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.label }}
          path: src-tauri/target/${{ matrix.rust_target }}/release/bundle/**/*
          retention-days: 7
          if-no-files-found: error

      - name: Upload source maps to Sentry
        # Publish-only: a validation run has no shipped build for these maps to
        # correspond to, and registering a Sentry release for it would pollute
        # the release list with versions no user ever runs.
        if: matrix.label == 'linux-x64' && needs.version.outputs.publish == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          VERSION="${{ needs.version.outputs.new_version }}"
          if [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] && [ -n "$SENTRY_PROJECT" ]; then
            npx @sentry/cli@latest releases \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              new "$VERSION"
            npx @sentry/cli@latest releases \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              files "$VERSION" \
              upload-sourcemaps ./dist \
              --url-prefix "~/"
            npx @sentry/cli@latest releases \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              finalize "$VERSION"
            echo "Source maps uploaded for v$VERSION"
          else
            echo "Sentry source map upload skipped (secrets not configured)"
          fi

  # ─── Job 4: Generate latest.json for Tauri updater ─────────
  updater-manifest:
    needs: [version, build]
    # No release exists on a validation run, so there is nothing to attach
    # latest.json to (and no .sig files, since updater artifacts are only
    # signed and uploaded on the publish path).
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.version.outputs.new_version }}"
          VERSION="${{ needs.version.outputs.new_version }}"
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          # Wait for GitHub to finalize release assets with retry logic
          MAX_RETRIES=5
          RETRY_DELAY=10
          for i in $(seq 1 $MAX_RETRIES); do
            RELEASE_JSON=$(gh api "repos/${REPO}/releases/tags/${TAG}" 2>/dev/null) && break
            echo "Attempt $i/$MAX_RETRIES: Release not ready, retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
            RETRY_DELAY=$((RETRY_DELAY * 2))
          done

          if [ -z "$RELEASE_JSON" ]; then
            echo "::error::Failed to fetch release after $MAX_RETRIES attempts"
            exit 1
          fi

          RELEASE_NOTES=$(echo "$RELEASE_JSON" | jq -r '.body // "New release available."')
          PUB_DATE=$(echo "$RELEASE_JSON" | jq -r '.published_at // empty')
          if [ -z "$PUB_DATE" ]; then
            PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          fi

          ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[].name')

          # Verify we have assets before proceeding
          ASSET_COUNT=$(echo "$ASSETS" | grep -c '.' || true)
          if [ "$ASSET_COUNT" -lt 4 ]; then
            echo "::warning::Only $ASSET_COUNT assets found, expected at least 4. Waiting for uploads..."
            sleep 30
            RELEASE_JSON=$(gh api "repos/${REPO}/releases/tags/${TAG}")
            ASSETS=$(echo "$RELEASE_JSON" | jq -r '.assets[].name')
          fi

          # Download all .sig files
          mkdir -p /tmp/sigs
          gh release download "$TAG" --repo "$REPO" --pattern "*.sig" --dir /tmp/sigs 2>/dev/null || true

          # Helper to read a signature file
          read_sig() {
            local pattern="$1"
            local sig_file=$(ls /tmp/sigs/ 2>/dev/null | grep -iE "$pattern" | head -1)
            if [ -n "$sig_file" ] && [ -f "/tmp/sigs/$sig_file" ]; then
              cat "/tmp/sigs/$sig_file"
            else
              echo ""
            fi
          }

          # Helper to find an asset URL
          find_asset() {
            local pattern="$1"
            local asset=$(echo "$ASSETS" | grep -iE "$pattern" | grep -v '\.sig$' | head -1)
            if [ -n "$asset" ]; then
              echo "${BASE_URL}/${asset}"
            else
              echo ""
            fi
          }

          # Find updater bundles (tauri-action creates .nsis.zip for Windows,
          # .msi.zip as fallback, .app.tar.gz for macOS, .AppImage.tar.gz for Linux)
          # Tauri 2 uses "x64" in filenames for x86_64 and "arm64" or "aarch64" for ARM
          WIN_X64_URL=$(find_asset 'x64.*(\.nsis\.zip|\.msi\.zip)$')
          WIN_X64_SIG=$(read_sig 'x64.*(\.nsis\.zip|\.msi\.zip)\.sig$')
          WIN_ARM64_URL=$(find_asset '(arm64|aarch64).*(\.nsis\.zip|\.msi\.zip)$')
          WIN_ARM64_SIG=$(read_sig '(arm64|aarch64).*(\.nsis\.zip|\.msi\.zip)\.sig$')
          MACOS_URL=$(find_asset '\.app\.tar\.gz$')
          MACOS_SIG=$(read_sig '\.app\.tar\.gz\.sig$')
          LINUX_URL=$(find_asset '\.AppImage\.tar\.gz$')
          LINUX_SIG=$(read_sig '\.AppImage\.tar\.gz\.sig$')

          echo "=== All release assets ==="
          echo "$ASSETS"
          echo ""
          echo "=== Matched updater bundles ==="
          echo "  WIN_X64_URL=$WIN_X64_URL"
          echo "  WIN_ARM64_URL=$WIN_ARM64_URL"
          echo "  MACOS_URL=$MACOS_URL"
          echo "  LINUX_URL=$LINUX_URL"
          echo ""

          # HARD-FAIL if any platform bundle or its signature is missing.
          # A latest.json with an empty url/signature doesn't degrade
          # gracefully — the updater on that platform errors on every
          # check, which reads as "updates are broken", silently. Better
          # to fail the release and fix the asset naming/signing than ship
          # a manifest that strands a platform (ship-loop Ops audit).
          MISSING=""
          [ -z "$WIN_X64_URL" ]   && MISSING="${MISSING} windows-x86_64(url)"
          [ -z "$WIN_X64_SIG" ]   && MISSING="${MISSING} windows-x86_64(sig)"
          [ -z "$WIN_ARM64_URL" ] && MISSING="${MISSING} windows-aarch64(url)"
          [ -z "$WIN_ARM64_SIG" ] && MISSING="${MISSING} windows-aarch64(sig)"
          [ -z "$MACOS_URL" ]     && MISSING="${MISSING} darwin(url)"
          [ -z "$MACOS_SIG" ]     && MISSING="${MISSING} darwin(sig)"
          [ -z "$LINUX_URL" ]     && MISSING="${MISSING} linux-x86_64(url)"
          [ -z "$LINUX_SIG" ]     && MISSING="${MISSING} linux-x86_64(sig)"
          if [ -n "$MISSING" ]; then
            echo "::error::Missing updater bundles/signatures for:${MISSING}. Check bundle.createUpdaterArtifacts, TAURI_SIGNING_PRIVATE_KEY, and the asset-name patterns above."
            exit 1
          fi

          # Build latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$RELEASE_NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg win_x64_url "$WIN_X64_URL" \
            --arg win_x64_sig "$WIN_X64_SIG" \
            --arg win_arm64_url "$WIN_ARM64_URL" \
            --arg win_arm64_sig "$WIN_ARM64_SIG" \
            --arg macos_url "$MACOS_URL" \
            --arg macos_sig "$MACOS_SIG" \
            --arg linux_url "$LINUX_URL" \
            --arg linux_sig "$LINUX_SIG" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  url: $win_x64_url,
                  signature: $win_x64_sig
                },
                "windows-aarch64": {
                  url: $win_arm64_url,
                  signature: $win_arm64_sig
                },
                "darwin-universal": {
                  url: $macos_url,
                  signature: $macos_sig
                },
                "darwin-x86_64": {
                  url: $macos_url,
                  signature: $macos_sig
                },
                "darwin-aarch64": {
                  url: $macos_url,
                  signature: $macos_sig
                },
                "linux-x86_64": {
                  url: $linux_url,
                  signature: $linux_sig
                }
              }
            }' > latest.json

          echo "--- latest.json ---"
          cat latest.json

          # Upload to release
          gh release delete-asset "$TAG" latest.json --repo "$REPO" --yes 2>/dev/null || true
          gh release upload "$TAG" latest.json --repo "$REPO"
