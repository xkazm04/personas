# .ai/manifest.yaml — the agent-facing contract for this repo.
# Generated by Ascent. Capabilities are tool-NEUTRAL (a name -> the command that fulfils it), the
# heavy subsystems are referenced by path, and unknown fields MUST be ignored — so this survives
# tool churn and schema growth. Full contract: docs/AI_MANIFEST_SPEC.md
schema: ai-manifest
schemaVersion: 0.1.0
spec: docs/AI_MANIFEST_SPEC.md
generatedAt: "2026-06-29"
generatedFrom: [package.json]

repo:
  name: personas
  purpose: "Local-first desktop app for orchestrating AI agent personas"
  languages: [typescript]
  archetype: team

# Capabilities, not tools. Add keys freely; older readers ignore unknown ones.
# `verified` is a claim the doctor flips to true once it has actually run the command.
capabilities:
  build: { command: "npm run build", verified: false }
  test: { command: "npm test", verified: false }
  lint: { command: "npm run lint", verified: false }
  typecheck: { command: "npx tsc --noEmit", verified: false }
  scan-secrets: { command: "node scripts/secret-scan.mjs", verified: false }
  evals: { command: "npm run test:evals", verified: false }

# Pointers — these subsystems can change format underneath without breaking this contract.
paths:
  contextIndex: .ai/context-index.json
  memory: .ai/memory/
  evals: evals/
  guardrails: .ai/guardrails.yaml

context:
  rule: "every module directory over 12 files has a CONTEXT.md"

boundaries:
  neverTouch: [src/lib/bindings/, src/i18n/generated/, src/lib/commandNames.generated.ts]
  secretsFrom: "OS keyring (Windows Credential Manager / macOS Keychain / Linux Secret Service); AES-256-GCM vault"

agents:
  - { id: backlog-scout, kind: subagent, entrypoint: ".claude/agents/athena-backlog-scout.md" }
  - { id: doc-reader, kind: subagent, entrypoint: ".claude/agents/athena-doc-reader.md" }
  - { id: persona-auditor, kind: subagent, entrypoint: ".claude/agents/athena-persona-auditor.md" }
  - { id: web-researcher, kind: subagent, entrypoint: ".claude/agents/athena-web-researcher.md" }

# The control model (shift-left): where each capability is PRIMARILY enforced. CI is the thin
# backstop for hard passes only. TUNE this split for your repo — fast checks pre-push; slow suites
# (full tests, full-tree SAST) in CI. The agent runs tests in its verify step regardless of placement.
controls:
  prePush: [lint, typecheck, scan-secrets, evals]
  ciHardPass: [test, sast, merge-gate]

# The organization's AI registry - knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
knowledge:
  domains: [software-engineering, llm-observability, localization]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored, made by ai-registry/scripts/link-skills.mjs); THIS list is the
# reviewable declaration. A skill not listed here is project-owned and lives in
# .claude/skills/ as a real directory.
skills:
  - conform
  - architect
  - consult
  - explorer
  - friend
  - i18n-translate
  - kpi-sim
  - leonardo
  - motionize
  - mvp
  - perfect
  - project-populate
  - promote
  - research
  - scan-sweep
  - ship-loop
  - spark
  - tiger
  - uat

# Scope - what this project does and deliberately does not do. Read by the registry's
# scripts/build-fleet-map.mjs to classify subjects this project has NO context for: an
# absence inside an out-of-scope category or subject is never proposed as a new direction;
# every other in-domain absence is a `candidate` for the intake direction pass. Keys are
# `<bundle>/<category>[/<subcategory>]` and `<bundle>/<subject>`. Decisions on proposed
# directions live in .ai/directions/ledger.jsonl. DRAFT written by the registry on
# 2026-09-02 from the purpose line and the project note - the owner edits this block, the
# registry only reads it.
scope:
  does:
    - run local AI agent personas over wrapped CLIs, local-first storage, one operator per install
    - observe runs - cost, health, traces - and tune routing from evidence
    - multi-locale desktop UI; companion voice dictation
  does_not:
    - hosted multi-tenant service, billing, or public web surfaces
    - CI/CD or deployment pipelines for other repositories
    - game, media, civic or recruiting domains
  out_of_scope_categories:
    - software-engineering/ui-surfaces/published-surfaces
    - software-engineering/engineering-assessment
  out_of_scope_subjects:
  directions_ledger: .ai/directions/ledger.jsonl
